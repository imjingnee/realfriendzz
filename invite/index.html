<style>
/* 牛皮紙冒險書：暖色紙底、墨褐色邊框、方塊像素小動畫。手機優先的單欄，一次只問一件事。 */
:root{
  --kraft:#D8BD92; --panel:#ECD9B4; --paper:#F6ECD2; --line:#A8895A; --edge:#8A6A40; --shade:#B79A6A;
  --ink:#4A3320; --sub:#7A5C38; --accent:#8A5A2B;
  --gold:#B8864B; --gold-ink:#FFF8E8; --ok:#4D7A3A; --no:#B3412F;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --bh:34px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{margin:0}
body{
  background-color:var(--kraft);
  background-image:
    radial-gradient(rgba(120,80,30,.10) 1px,transparent 1px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px);
  background-size:6px 6px,auto;
  background-attachment:fixed;
  color:var(--ink);font-family:var(--sans);line-height:1.65;min-height:100%;
}
.wrap{max-width:480px;margin:0 auto;padding:16px 18px 56px}
h1,h2,.serif{font-family:var(--serif);text-wrap:balance}
h1{font-size:1.7rem;line-height:1.35;margin:.2em 0 .4em}
h2{font-size:1.28rem;line-height:1.45;margin:.2em 0 .6em;font-weight:700}
p{margin:.5em 0}
.sub{color:var(--sub);font-size:.94rem}
.small{color:var(--sub);font-size:.82rem}
.top{display:flex;align-items:center;margin:0 0 10px}
.back{background:none;border:0;color:var(--sub);font:inherit;font-size:.9rem;cursor:pointer;padding:6px 2px}
.back:focus-visible,.opt:focus-visible,.btn:focus-visible,a.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.date{display:flex;align-items:baseline;gap:10px;margin:14px 0 4px}
.date b{font-family:var(--serif);font-size:3.4rem;line-height:1;color:var(--accent)}
.date span{color:var(--sub)}
.panel{background:var(--panel);border:2px solid var(--edge);border-radius:8px;padding:16px;box-shadow:0 4px 0 var(--shade)}
.stack{display:flex;flex-direction:column;gap:10px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:1rem;color:var(--ink);background:var(--panel);
  border:2px solid var(--edge);border-radius:8px;padding:13px 16px;cursor:pointer;box-shadow:0 3px 0 var(--shade)}
.opt.on{border-color:var(--ink);background:#F3E2B8;font-weight:700;transform:translateY(2px);box-shadow:0 1px 0 var(--shade)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:#DCEBC9}
.opt.wrong{border-color:var(--no);background:#F2D3C6}
.heroes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.hero{font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px 4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 3px 0 var(--shade)}
.hero .hp{display:block;width:48px;height:84px}.hero .hp svg{width:100%;height:100%;image-rendering:pixelated}
.hero.on{border-color:var(--ink);background:#F3E2B8;transform:translateY(2px);box-shadow:0 1px 0 var(--shade)}
.cal{background:var(--panel);border:2px solid var(--edge);border-radius:10px;padding:10px;margin:10px 0}
.calh{display:flex;align-items:center;justify-content:space-between;font-weight:700;margin-bottom:6px}
.calh button{font:inherit;font-size:1.2rem;line-height:1;background:var(--paper);border:2px solid var(--edge);border-radius:8px;width:44px;height:40px;cursor:pointer;color:var(--ink)}
.calh button:disabled{opacity:.3;cursor:default}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calg .wd{font-size:.78rem;color:var(--sub);padding:2px 0}
.calg .d{min-height:44px;border:2px solid transparent;border-radius:8px;background:transparent;font:inherit;color:#9a8460;opacity:.45}
.calg .d.av{background:var(--paper);border-color:var(--line);color:var(--ink);opacity:1;font-weight:700;cursor:pointer}
.calg .d.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.calg .d.open{outline:3px solid var(--accent);outline-offset:1px}
.calg .d.adj{background:transparent;border:2px dashed var(--accent);color:var(--accent);opacity:1;font-weight:700}
.calg .d:not([disabled]):not(.av):not(.adj){opacity:.8;cursor:pointer}
.opt.adjbtn{border-style:dashed}
.lg{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px}
.lg.av{background:var(--paper);border:2px solid var(--line)}.lg.adj{border:2px dashed var(--accent)}
.pick{margin:12px 0}.pick .grp{margin-top:8px}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font:inherit;font-weight:700;font-size:1.02rem;
  background:var(--gold);color:var(--gold-ink);border:2px solid var(--ink);border-radius:8px;padding:14px 16px;margin-top:18px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--edge);margin-top:10px;box-shadow:none}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.btnrow .btn{flex:1 1 140px;margin-top:10px}
label.f{display:block;font-weight:700;font-size:.92rem;margin:18px 0 6px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:8px;padding:12px 14px}
textarea{resize:vertical;line-height:1.6}
.reveal{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--paper);border:2px solid var(--line)}
.reveal b.ok{color:var(--ok)}.reveal b.no{color:var(--no)}
.card{text-align:center;background:linear-gradient(160deg,#F3E2B8,#E5CF9F);border:2px solid var(--accent);border-radius:10px;padding:22px 18px;margin:8px 0 14px;box-shadow:0 4px 0 var(--shade)}
.card .em svg{width:84px;height:119px;display:block;margin:0 auto}
.card .rn{font-family:var(--serif);font-size:1.5rem;color:var(--accent);margin:4px 0 0}
.card .tg{font-size:.84rem;color:var(--sub)}
.card .ln{margin:10px 0 0;font-size:1rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;margin-top:16px;padding-top:14px;border-top:2px dashed var(--line);font-size:.9rem}
.kv dt{color:var(--sub)}.kv dd{margin:0}
.note{font-size:.84rem;color:var(--sub);border-top:2px solid var(--line);margin-top:22px;padding-top:12px}
.grp{font-family:var(--serif);font-size:1.02rem;color:var(--accent);margin:20px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chip{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:3px 14px;font-size:.92rem}
.link{background:none;border:0;color:var(--accent);font:inherit;font-size:.92rem;text-decoration:underline;cursor:pointer;padding:10px 0}

/* ---- 進度小動畫：方塊小路，每走一步亮一塊，終點是星球和石像 ---- */
#scene{position:relative;height:126px;margin:0 2px 8px}
#scene .blocks{position:absolute;left:0;right:0;bottom:0;display:flex}
#scene .b{flex:1;height:var(--bh);position:relative;border:1px solid var(--ink);border-left-width:0;background:linear-gradient(#6F9A45 0 30%,#8A5A34 30% 100%)}
#scene .b:first-child{border-left-width:1px}
#scene .b::after{content:"";position:absolute;left:0;right:0;top:30%;bottom:0;background:radial-gradient(#6D4426 1px,transparent 1px) 0 0/6px 6px}
#scene .b.todo{filter:saturate(.3) brightness(1.1)}
#scene .b.done::before{content:"";position:absolute;left:4px;top:3px;width:6px;height:3px;background:#F2C94C;opacity:.9;z-index:1}
#scene .b.pop{animation:pop2 .45s steps(3)}
@keyframes pop2{0%{transform:translateY(0)}40%{transform:translateY(-6px)}100%{transform:translateY(0)}}
#scene .walker{position:absolute;bottom:var(--bh);width:32px;height:56px;left:0;transition:left .6s steps(8)}
#scene svg{width:100%;height:100%;shape-rendering:crispEdges;display:block}
#scene .walker svg{animation:bob .5s steps(1) infinite}
#scene .walker.idle svg{animation:none}
#scene .walker[data-k=rose] svg{animation:hop .5s steps(1) infinite}
#scene .walker[data-k=rose].idle svg{animation:none}
@keyframes hop{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-2px)}}
#scene .legA{animation:legA .5s steps(1) infinite}
#scene .legB{animation:legB .5s steps(1) infinite}
#scene .walker.idle .legA{animation:none;opacity:1}
#scene .walker.idle .legB{animation:none;opacity:0}
@keyframes legA{0%{opacity:1}50%{opacity:0}}
@keyframes legB{0%{opacity:0}50%{opacity:1}}
#scene .planet{position:absolute;right:0;bottom:var(--bh);width:56px;height:32px}
#scene .planet svg{animation:sway 2s steps(2) infinite}
@keyframes sway{0%{transform:translateY(0)}50%{transform:translateY(-2px)}}
#scene .eye{display:none}
#scene .planet.five .eye{display:block;animation:glow .5s steps(1) infinite}
@keyframes glow{0%{opacity:1}50%{opacity:.35}}
#scene .walker.five{animation:jump .6s steps(3) 2}
@keyframes jump{0%{transform:translateY(0)}50%{transform:translateY(-16px)}100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){
  #scene .walker{transition:none}
  #scene .walker svg,#scene .planet svg,#scene .legA,#scene .legB,#scene .b.pop,#scene .walker.five,#scene .planet.five .eye{animation:none}
  #scene .legB{opacity:0}
}

function msg(){
  const r=role();
  const pick=(arr,idx)=>idx.map(i=>arr[i]).join('、');
  return [
    `【${CONFIG.title}】`,
    ...(A.hero?[`最喜歡的《小王子》角色：${HEROES.find(h=>h.k===A.hero).n}`]:[]),
    `我是：${A.name.trim()||'（沒留暱稱）'}（${A.rel===REL.length-1&&A.relOther.trim()?`其他：${A.relOther.trim()}`:REL[A.rel]}）`,
    `我在：${cityName()}`,
    `方便的時間：${dateLabels().join('；')||'（沒選）'}`,
    ...((A.acts.length||A.actText.trim()||A.actLink.trim())?[`想一起做：${A.acts.map(i=>ACTS[i]).join('、')||'（沒選）'}`]:[]),
    ...(A.actText.trim()?[`想去／想做：${A.actText.trim()}`]:[]),
    ...(A.actLink.trim()?[`連結：${normLink(A.actLink)}`]:[]),
    `見面方式：${FORMAT[A.format]}`,
    ...((A.email.trim()||A.ig.trim())?[`聯絡：${[A.email.trim(),A.ig.trim()&&'IG '+A.ig.trim()].filter(Boolean).join('／')}`]:[]),
    ...(groupOK()&&A.invitees.length?[`希望你也邀請：${A.invitees.join('、')}`]:[]),
    `飲食：${A.food.length?pick(FOOD,A.food):'沒有特別'}${A.foodNote.trim()?`（備註：${A.foodNote.trim()}）`:''}`,
    `喜歡的氣氛：${VIBE[A.vibe]}`,
    `想聊：${A.topic.length?pick(TOPIC,A.topic):'都可以'}`,
    `見面時的我：${ARR[A.arrive]}`,
    `我的赴約角色：${r.n}`,
    `猜猜我：猜中 ${hits()} / ${scored()}`,
    openAns()?`你覺得你是我的：${openAns()}`:null
  ].filter(Boolean).join('\n');
}

/* ===== 畫面 ===== */
function opts(list,sel,act,extra=''){
  return `<div class="stack">${list.map((t,i)=>`<button type="button" class="opt ${(Array.isArray(sel)?sel.includes(i):sel===i)?'on':''}" data-a="${act}" data-v="${i}" ${extra}>${esc(t)}</button>`).join('')}</div>`;
}
const groupOK=()=>A.format===1||A.format===2;
function inviteBox(){
  if(!groupOK())return '';
  return `<div class="card" style="margin-top:14px"><label class="f" for="iv">有想一起見面的朋友嗎？你希望我再邀請誰？，最多 5 位，選填）</label>
    <div class="btnrow"><input id="iv" type="text" maxlength="40" placeholder="填對方的名字" value="${esc(A.inviteInput)}" data-i="inviteInput" style="flex:2 1 160px"><button type="button" class="btn ghost" data-a="addinv" style="flex:1 1 80px" ${A.invitees.length>=5?'disabled':''}>新增</button></div>
    ${A.invitees.length?`<div class="chips">${A.invitees.map((n,i)=>`<span class="chip">${esc(n)} <button type="button" data-a="delinv" data-v="${i}" aria-label="移除 ${esc(n)}" style="border:0;background:none;font:inherit;cursor:pointer">✕</button></span>`).join('')}</div>`:''}</div>`;
}
function canNext(id){
  if(id==='intro')return !!A.hero;
  if(id==='who')return A.name.trim().length>0&&A.rel>=0;
  if(id==='city')return A.city>=0;
  if(id==='dates')return A.dates.length>0||A.proposals.length>0;
  if(id==='plan')return linkOK(A.actLink);
  if(id==='format')return A.format>=0;
  if(id==='vibe')return A.vibe>=0;
  if(id==='arrive')return A.arrive>=0;
  if(id.startsWith('g'))return A.g[+id[1]]>=0;
  return true;
}
function dateBtn(k,text){
  return `<button type="button" class="opt ${A.dates.includes(k)?'on':''}" data-a="date" data-k="${k}">${esc(text)}</button>`;
}
function calView(home,showAll){
  const cis=showAll?CONFIG.trips.map((_,i)=>i):[home];
  const all={};cis.forEach(ci=>{const m=dayMap(ci);Object.keys(m).forEach(d=>(all[d]=all[d]||[]).push(ci))});
  const days=Object.keys(all).sort();if(!days.length)return '<p class="sub">這個城市目前沒有排日期，請用下面的「提議別的時間」告訴我你方便的日子，我再跟你約。</p>';
  const t0=new Date(),todayS=`${t0.getFullYear()}-${pad2(t0.getMonth()+1)}-${pad2(t0.getDate())}`;
  const months=[];{let [fy,fm]=days[0].slice(0,7).split('-').map(Number);const [ly,lm]=days[days.length-1].slice(0,7).split('-').map(Number);
    for(let k=0;k<12;k++){months.push(`${fy}-${pad2(fm)}`);if(fy===ly&&fm===lm+2)break;fm++;if(fm>12){fm=1;fy++}}}
  if(!months.includes(A.calMonth))A.calMonth=months[0];
  const mi=months.indexOf(A.calMonth),[y,mo]=A.calMonth.split('-').map(Number);
  const first=new Date(y,mo-1,1).getDay(),count=new Date(y,mo,0).getDate();
  const picked=pickedSlots();
  let g=['日','一','二','三','四','五','六'].map(w=>`<div class="wd">${w}</div>`).join('')+'<div></div>'.repeat(first);
  for(let d=1;d<=count;d++){
    const ds=`${y}-${pad2(mo)}-${pad2(d)}`,av=!!all[ds],sel=picked.some(x=>x.d===ds),adj=A.proposals.some(x=>x.d===ds),past=ds<todayS;
    g+=`<button type="button" class="d ${av?'av':''} ${sel?'sel':''} ${adj&&!sel?'adj':''} ${A.dayOpen===ds?'open':''}" ${past?'disabled':`data-a="day" data-d="${ds}"`} aria-label="${mo}月${d}日${av?'':'（沒有安排，可請對方調整）'}${sel||adj?'（已選）':''}">${d}</button>`;
  }
  let h=`<div class="cal"><div class="calh"><button type="button" data-a="calnav" data-m="${months[mi-1]||''}" ${mi>0?'':'disabled'} aria-label="上個月">‹</button><span>${y} 年 ${mo} 月</span><button type="button" data-a="calnav" data-m="${months[mi+1]||''}" ${mi<months.length-1?'':'disabled'} aria-label="下個月">›</button></div><div class="calg">${g}</div></div>`;
  h+=`<p class="small"><span class="lg av"></span> 我有排的日子　<span class="lg adj"></span> 我原本沒排的日子（你只有這天方便的話，也可以點）</p>`;
  if(A.dayOpen){
    const d=A.dayOpen,offered=all[d]||[],q=A.proposals.find(x=>x.cal&&x.d===d),mine=q?q.periods:[];
    const offeredPs=new Set();offered.forEach(ci=>dayMap(ci)[d].forEach(pp=>offeredPs.add(pp)));
    const rest=PERIODS.filter(pp=>!offeredPs.has(pp));
    h+=`<div class="pick"><b>${esc(fmtDay(d))}　你想約哪個時段？</b>`+offered.map(ci=>{
      const ps=dayMap(ci)[d];
      return `${cis.length>1?`<div class="grp">${esc(CONFIG.trips[ci].city)}</div>`:''}<div class="btnrow">${ps.map(pp=>{const k=`${ci}|${d}|${pp}`;return `<button type="button" class="opt ${A.dates.includes(k)?'on':''}" data-a="date" data-k="${k}" style="flex:1 1 90px;text-align:center">${pp}</button>`}).join('')}</div>`}).join('')+
    (rest.length?`<div class="grp">${offered.length?'這些時段我原本沒排':'這天我原本沒排'}</div><p class="small">如果你只有這個時段方便，點下面告訴我，我會想辦法調整。</p><div class="btnrow">${rest.map(pp=>`<button type="button" class="opt adjbtn ${mine.includes(pp)?'on':''}" data-a="adj" data-d="${d}" data-p="${pp}" style="flex:1 1 90px;text-align:center">${pp}</button>`).join('')}</div>`:'')+`</div>`;
  }else h+=`<p class="small">先點一個日子。</p>`;
  const txt=dateLabels(true).filter(t=>!/^這些時間都不行|^都不行/.test(t));
  if(txt.length)h+=`<div class="reveal"><b>你選了：</b><br>${txt.map(esc).join('<br>')}</div>`;
  return h;
}
function propView(){
  const own=A.proposals.map((q,i)=>[q,i]).filter(x=>!x[0].cal);
  const list=own.length?`<div class="reveal"><b>你的提議：</b><br>${own.map(([q,i])=>`${esc(fmtDay(q.d))} ${esc(q.periods.join('、'))}${q.place?`（${esc(q.place)}）`:''} <button type="button" class="link" data-a="propdel" data-v="${i}" aria-label="移除提議" style="padding:0 6px">移除</button>`).join('<br>')}</div>`:'';
  if(!A.propOpen)return `<p class="sub">日曆上沒有適合的時間？換你來約我！告訴我你方便的日子，我會盡量配合。</p><button type="button" class="opt" data-a="propopen">＋ 提議別的時間</button>${list}`;
  const today=new Date(),min=`${today.getFullYear()}-${pad2(today.getMonth()+1)}-${pad2(today.getDate())}`;
  return `<div class="cal"><b>你想約…</b>
    <label class="f" for="pd">哪一天？</label><input id="pd" type="date" min="${min}" value="${esc(A.pd)}" data-i="pd">
    <label class="f">什麼時段？（可多選）</label>
    <div class="btnrow">${PERIODS.map(p=>`<button type="button" class="opt ${A.pp.includes(p)?'on':''}" data-a="pper" data-p="${p}" style="flex:1 1 90px;text-align:center">${p}</button>`).join('')}</div>
    <label class="f" for="pl">城市或地點（選填）</label><input id="pl" type="text" maxlength="40" placeholder="例如：吉隆坡、你想去的咖啡廳" value="${esc(A.pplace)}" data-i="pplace">
    ${A.proposals.filter(x=>!x.cal).length>=3?'<p class="small">最多提議 3 個。</p>':`<p><button type="button" class="btn" data-a="propadd" ${A.pd&&A.pp.length?'':'disabled'} style="margin-top:12px">加入這個提議</button></p>`}
    <button type="button" class="link" data-a="propopen">收起</button></div>${list}`;
}

/* ===== 進度小動畫（原創像素圖，不使用任何現成遊戲的素材） ===== */
function pxRect(x,y,w,h,f,cls){return '<rect'+(cls?' class="'+cls+'"':'')+' x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+f+'"/>'}
function pxSprite(rows,pal,ox,oy){let o='';for(let y=0;y<rows.length;y++)for(let x=0;x<rows[y].length;x++){const c=rows[y][x];if(c==='.'||!pal[c])continue;o+=pxRect(x+(ox||0),y+(oy||0),1,1,pal[c])}return o}
const HEROES=[{k:'prince',n:'小王子'},{k:'fox',n:'狐狸'},{k:'rose',n:'玫瑰'}];
const WALKERS={
  prince:{pal:{Y:'#F2C94C',y:'#C9A227',R:'#C9503A',H:'#E8B84A',h:'#C9962F',S:'#F0C9A0',E:'#3A2A1A',C:'#4F8A8B',c:'#3C6A6B',F:'#E8B84A',P:'#3B4A6B',B:'#3A2A1A'},
    body:["..Y....YY....Y..","..YY..YYYY..YY..","..YYYYYRRYYYYY..","..yyyyyyyyyyyy..","...HHHHHHHHHH...","..HHHHHHHHHHHH..","..HHSSSSSSSSHH..","..HSSSSSSSSSSH..","..HSSESSSSESSH..","..hSSESSSSESSh..","..hSSSSSSSSSSh..","...hSSSSSSSSh...","....FFFFFFFF....","...FFFFFFFFFFFF.","..CCCFFFCCCC.FF.","..CCCCCCCCCCCC..","..CCcCCCCCCcCC..","..CCCCCCCCCCCC..","..SSCCCCCCCCSS..","...cCCCCCCCCc..."]},
  fox:{pal:{O:'#E0862B',o:'#B8651A',T:'#D17A22',W:'#F6EBD2',K:'#3A2A1A',N:'#6B3F1A',P:'#C9751F',B:'#F6EBD2'},
    body:["..oO........Oo..","..OOo......oOO..","..OOOOooooOOOO..","..OOOOOOOOOOOO..","..OOOOOOOOOOOO..","..OOKOOOOOOKOO..","..OOKOOOOOOKOO..","..OWWOOOOOOWWO..","...WWWWOOWWWW...","....WWWNNWWW....","....WWWWWWWW....","....OOWWWWOO....","...OOOWWWWOOO...","...OOOWWWWOOO...","..OOOOWWWWOOOO..","..OOOOOWWOOOOOT.","..OOOOOOOOOOOTTT","..OOoOOOOOOOTTTT","..OOOOOOOOOOTTTT","...OOOOOOOOO.TTW"],
    legs:["....PPPPPPPP.TTW","....PPPPPPPP.TWW","....PPP..PPP..W.","....PPP..PPP....","....PPP..PPP...."]},
  rose:{pal:{R:'#D6384B',r:'#A3202F',p:'#F27B8A',h:'#FFC2CB',E:'#3A2A1A',c:'#FF8FA0',m:'#7A1420',G:'#4F8A3A',g:'#34692A',L:'#7FB069',l:'#4D7A3A',B:'#2F4F24'},
    body:[".....rrrrrr.....", "...rrRRRRRRrr...", "..rRRRRRRRRRRr..", ".rRRhhRRRRRRRRr.", ".rRhRRRRRRRRRRr.", ".rRRRRRRRRRRRRr.", ".rRRRERRRRERRRr.", ".rRRRERRRRERRRr.", ".rRccRRRRRRccRr.", ".rRRRRRmmRRRRRr.", "..rRRRRRRRRRRr..", "...rrRRRRRRrr...", ".....rrrrrr.....", "......gGGg......", ".LLL..gGGg..LLL.", ".lLLL.GGGG.LLLl.", "..lL...GG...Ll..", ".......GG.......", ".......GG.......", ".......GG......."],
    legs:[".......GG.......",".......GG.......",".......GG.......",".......GG.......",".......GG......."],
    A:["......GGG.......","......BBBB......","......BBBB......"],hop:1}
};
function walkerSvg(kind){
  const W=WALKERS[kind]||WALKERS.prince,P=W.pal,body=W.body;
  const legs=W.legs||["....PPPPPPPP....","....PPPPPPPP....","....PPP..PPP....","....PPP..PPP....","....PPP..PPP...."];
  const A=W.A||["....PPP..PP.....","...BBBB..BBB....","...BBBB........."];
  const B=A.map(r=>r.split('').reverse().join(''));
  return '<svg viewBox="0 0 16 28">'+pxSprite(body,P,0,0)+pxSprite(legs,P,0,20)+'<g class="legA">'+pxSprite(A,P,0,25)+'</g><g class="legB">'+pxSprite(B,P,0,25)+'</g></svg>';
}
function syncHero(){
  const w=document.getElementById('walker');if(!w)return;
  const k=A.hero||'prince';if(w.dataset.k!==k){w.innerHTML=walkerSvg(k);w.dataset.k=k}
}
function planetSvg(){
  let o='';
  const M={G:'#A8A8A0',g:'#9A9A92',d:'#7A7A72',D:'#3A3A34',M:'#5A5A54'};
  const moai=["..gGGGGGGg..","..GGGGGGgd..","..GGGGGGgd..","..GDDGGDDgd.","..GDDGGDDgd.","..GGGGGGggd.","..GGGddGgd..","..GGGddGgd..","..GGGddGgd..","..GGGGGGgd..","..GGMMMMgd..","..GGGGGGgd..","...GGGGgd...","..GGGGGGGgd.","..GGGGGGGgd.","..GGGGGGGgd."];
  o+=pxSprite(moai,M,16,0)+pxRect(19,3,2,2,'#FFE27A','eye')+pxRect(23,3,2,2,'#FFE27A','eye')+pxRect(19,3,1,1,'#fff','eye')+pxRect(23,3,1,1,'#fff','eye');
  return '<svg viewBox="0 0 28 16">'+o+'</svg>';
}
let sceneReady=false,scenePrev=0,sceneTimer=0;
function initScene(){
  const el=document.getElementById('scene');if(!el)return;
  const N=STEPS.length+1; // 每一步一格，最後一格是石像的
  el.innerHTML='<div class="walker idle" id="walker">'+walkerSvg(A.hero||'prince')+'</div><div class="planet" id="planet">'+planetSvg()+'</div><div class="blocks" id="blocks">'+'<div class="b todo"></div>'.repeat(N)+'</div>';
  sceneReady=true;
  window.addEventListener('resize',()=>{const w=document.getElementById('walker');if(!w)return;w.style.transition='none';updateScene(true);setTimeout(()=>{w.style.transition=''},50)});
}
function updateScene(silent){
  if(!sceneReady)return;
  const el=document.getElementById('scene'),w=document.getElementById('walker'),pl=document.getElementById('planet');
  const bs=document.getElementById('blocks').children,B=STEPS.length-1,N=bs.length,tw=el.clientWidth;
  for(let i=0;i<N;i++){const on=i<=step||(i===N-1&&step>=B);let c='b '+(on?'done':'todo');if(!silent&&i===step&&step>scenePrev)c+=' pop';bs[i].className=c}
  // 旅人站在第 step 格的正中央；最後一格留給石像
  w.style.left=(((Math.min(step,B)+0.5)/N)*tw-20)+'px';
  w.classList.remove('idle','five');pl.classList.remove('five');
  clearTimeout(sceneTimer);
  sceneTimer=setTimeout(()=>{w.classList.add('idle');if(step>=B){w.classList.add('five');pl.classList.add('five')}},750);
  el.setAttribute('aria-valuenow',String(Math.round(step/B*100)));
  scenePrev=step;
}
function render(keepScroll){
  const y=window.scrollY,id=STEPS[step];
  const pct=Math.round(step/(STEPS.length-1)*100);
  const top=step>0?`<div class="top"><button type="button" class="back" data-a="prev" aria-label="上一步">← 上一步</button></div>`:'';
  document.getElementById('app').innerHTML=top+view(id);
  syncHero();updateScene();
  window.scrollTo(0,keepScroll?y:0);
}
function toggle(arr,v,max){const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else if(!max||arr.length<max)arr.push(v)}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,v=+b.dataset.v;
  switch(a){
    case 'next':if(canNext(STEPS[step])){step=Math.min(STEPS.length-1,step+1);A.hint='';render(false)}break;
    case 'prev':step=Math.max(0,step-1);render(false);break;
    case 'rel':A.rel=v;render(true);break;
    case 'guess':{const i=+STEPS[step][1];if(A.g[i]<0){A.g[i]=v;render(true)}break}
    case 'city':if(A.city!==v){A.city=v;A.dates=[];A.showAll=false;A.calMonth='';A.dayOpen=''}render(true);break;
    case 'adj':{
      const d=b.dataset.d,pp=b.dataset.p;let q=A.proposals.find(x=>x.cal&&x.d===d);
      if(!q){q={d,periods:[],place:(A.city>=0&&A.city<CONFIG.trips.length)?CONFIG.trips[A.city].city:'',cal:true};A.proposals.push(q)}
      const i=q.periods.indexOf(pp);if(i>=0)q.periods.splice(i,1);else q.periods.push(pp);
      q.periods=PERIODS.filter(x=>q.periods.includes(x));
      if(!q.periods.length)A.proposals.splice(A.proposals.indexOf(q),1);
      render(true);break}
    case 'propopen':A.propOpen=!A.propOpen;render(true);break;
    case 'pper':{const p=b.dataset.p;const i=A.pp.indexOf(p);if(i>=0)A.pp.splice(i,1);else A.pp.push(p);render(true);break}
    case 'propadd':if(A.pd&&A.pp.length&&A.proposals.filter(x=>!x.cal).length<3){A.proposals.push({d:A.pd,periods:PERIODS.filter(p=>A.pp.includes(p)),place:A.pplace.trim().slice(0,40)});A.pd='';A.pp=[];A.pplace='';A.propOpen=false}render(true);break;
    case 'propdel':A.proposals.splice(v,1);render(true);break;
    case 'day':A.dayOpen=A.dayOpen===b.dataset.d?'':b.dataset.d;render(true);break;
    case 'calnav':if(b.dataset.m){A.calMonth=b.dataset.m;A.dayOpen=''}render(true);break;
    case 'showall':A.showAll=true;A.calMonth='';render(true);break;
    case 'date':{const k=b.dataset.k;const i=A.dates.indexOf(k);if(i>=0)A.dates.splice(i,1);else A.dates.push(k);render(true);break}
    case 'hero':A.hero=b.dataset.k;render(true);break;
    case 'format':A.format=v;render(true);break;
    case 'act':toggle(A.acts,v,0);render(true);break;
    case 'addinv':{const n=A.inviteInput.trim();if(n&&A.invitees.length<5&&!A.invitees.includes(n))A.invitees.push(n);A.inviteInput='';render(true);break}
    case 'delinv':A.invitees.splice(v,1);render(true);break;
    case 'food':toggle(A.food,v,0);render(true);break;
    case 'vibe':A.vibe=v;render(true);break;
    case 'arrive':A.arrive=v;render(true);break;
    case 'topic':toggle(A.topic,v,3);render(true);break;
    case 'igcopy':{try{navigator.clipboard.writeText(msg())}catch(_){}break}
    case 'again':A=fresh();step=0;render(false);break;
    case 'copy':{
      let ok=false;
      try{await navigator.clipboard.writeText(msg());ok=true}catch(_){}
      if(!ok){try{const t=document.getElementById('out');t.select();t.setSelectionRange(0,99999);ok=document.execCommand('copy')}catch(_){}}
      A.hint=ok?'已複製，貼到 IG 或任何聊天室傳給我就可以了。':'沒辦法自動複製，請長按上方文字框，選「全選」再複製。';
      render(true);break}
    case 'fbsend':{
      if(A.sending||A.sent)break;
      if(!emailOK(A.email.trim())){A.hint='Email 格式好像不太對，請檢查一下，或清空不填。';render(true);break}
      A.sending=true;A.hint='';render(true);
      const r=role(),relation=A.rel===REL.length-1&&A.relOther.trim()?'其他：'+A.relOther.trim():REL[A.rel];
      const payload={name:A.name.trim(),relation,city:cityName(),dates:dateLabels(),slots:slotsData(),format:FORMAT[A.format],
        invitees:groupOK()?A.invitees.slice(0,5):[],email:A.email.trim(),ig:A.ig.trim().replace(/^@/,''),role:r.n,guess:`${hits()} / ${scored()}`,hero:(HEROES.find(h=>h.k===A.hero)||{}).n||'',acts:A.acts.map(i=>ACTS[i]),planText:A.actText.trim(),planLink:normLink(A.actLink),message:msg()};
      const jobs=[];
      if(CONFIG.sheetUrl)jobs.push((async()=>{
        const res=await fetch(CONFIG.sheetUrl,{method:'POST',body:JSON.stringify(payload)});
        const j=await res.json();if(!j.ok)throw new Error(j.error||'sheet');
      })());
      if(CONFIG.firebase)jobs.push((async()=>{
        const V='13.4.0',B='https://www.gstatic.com/firebasejs/'+V+'/';
        const [{initializeApp},{getAuth,signInAnonymously},{getFirestore,collection,addDoc,serverTimestamp}]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
        const app=initializeApp(CONFIG.firebase);
        await signInAnonymously(getAuth(app));
        await addDoc(collection(getFirestore(app),'invites'),{
          createdAt:serverTimestamp(),name:payload.name,relation,city:payload.city,dates:payload.dates,format:payload.format,
          invitees:payload.invitees,email:payload.email,ig:payload.ig,role:r.n,guessHits:hits(),guessTotal:scored(),message:payload.message});
      })());
      const results=await Promise.allSettled(jobs);
      results.filter(x=>x.status==='rejected').forEach(x=>console.error(x.reason));
      if(results.some(x=>x.status==='fulfilled'))A.sent=true;
      else A.hint='直接傳送失敗了，請改用下面的 IG／複製。';
      A.sending=false;render(true);break}
    case 'share':{
      let done=false;
      try{if(navigator.share){await navigator.share({text:msg()});done=true;A.hint=''}}catch(err){if(err&&err.name==='AbortError')done=true}
      if(!done)A.hint='這個瀏覽器開不了分享選單，請用「複製訊息」。';
      render(true);break}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='iv'){e.preventDefault();const b=document.querySelector('[data-a=addinv]');if(b)b.click()}});
document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.i;
  if(k==='actLink'){A.actLink=e.target.value;const nb=document.querySelector('.btn[data-a=next]'),h=document.getElementById('alh');if(nb)nb.disabled=!linkOK(A.actLink);if(h)h.textContent=linkOK(A.actLink)?'':'連結格式好像不太對，請檢查一下，或清空不填。';return}
  if(k==='pd'||k==='pplace'){A[k]=e.target.value;const ab=document.querySelector('[data-a=propadd]');if(ab)ab.disabled=!(A.pd&&A.pp.length);return}
  if(k){A[k]=e.target.value;if(k==='email'||k==='ig'){const o=document.getElementById('out');if(o)o.value=msg()}if(k==='name'){const b=document.querySelector('.btn[data-a=next]');if(b)b.disabled=!canNext(STEPS[step])}}
});
initScene();
render(false);
</script>
