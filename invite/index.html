<style>
/* 牛皮紙冒險書：暖色紙底、墨褐色邊框、方塊像素小動畫。手機優先的單欄，一次只問一件事。 */
:root{
  --kraft:#D8BD92; --panel:#ECD9B4; --paper:#F6ECD2; --line:#A8895A; --edge:#8A6A40; --shade:#B79A6A;
  --ink:#4A3320; --sub:#7A5C38; --accent:#8A5A2B;
  --gold:#B8864B; --gold-ink:#FFF8E8; --ok:#4D7A3A; --no:#B3412F;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --bh:34px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{margin:0}
body{
  background-color:var(--kraft);
  background-image:
    radial-gradient(rgba(120,80,30,.10) 1px,transparent 1px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px);
  background-size:6px 6px,auto;
  background-attachment:fixed;
  color:var(--ink);font-family:var(--sans);line-height:1.65;min-height:100%;
}
.wrap{max-width:480px;margin:0 auto;padding:16px 18px 56px}
h1,h2,.serif{font-family:var(--serif);text-wrap:balance}
h1{font-size:1.7rem;line-height:1.35;margin:.2em 0 .4em}
h2{font-size:1.28rem;line-height:1.45;margin:.2em 0 .6em;font-weight:700}
p{margin:.5em 0}
.sub{color:var(--sub);font-size:.94rem}
.small{color:var(--sub);font-size:.82rem}
.top{display:flex;align-items:center;margin:0 0 10px}
.back{background:none;border:0;color:var(--sub);font:inherit;font-size:.9rem;cursor:pointer;padding:6px 2px}
.back:focus-visible,.opt:focus-visible,.btn:focus-visible,a.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.date{display:flex;align-items:baseline;gap:10px;margin:14px 0 4px}
.date b{font-family:var(--serif);font-size:3.4rem;line-height:1;color:var(--accent)}
.date span{color:var(--sub)}
.panel{background:var(--panel);border:2px solid var(--edge);border-radius:8px;padding:16px;box-shadow:0 4px 0 var(--shade)}
.stack{display:flex;flex-direction:column;gap:10px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:1rem;color:var(--ink);background:var(--panel);
  border:2px solid var(--edge);border-radius:8px;padding:13px 16px;cursor:pointer;box-shadow:0 3px 0 var(--shade)}
.opt.on{border-color:var(--ink);background:#F3E2B8;font-weight:700;transform:translateY(2px);box-shadow:0 1px 0 var(--shade)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:#DCEBC9}
.opt.wrong{border-color:var(--no);background:#F2D3C6}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font:inherit;font-weight:700;font-size:1.02rem;
  background:var(--gold);color:var(--gold-ink);border:2px solid var(--ink);border-radius:8px;padding:14px 16px;margin-top:18px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--edge);margin-top:10px;box-shadow:none}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.btnrow .btn{flex:1 1 140px;margin-top:10px}
label.f{display:block;font-weight:700;font-size:.92rem;margin:18px 0 6px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:8px;padding:12px 14px}
textarea{resize:vertical;line-height:1.6}
.reveal{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--paper);border:2px solid var(--line)}
.reveal b.ok{color:var(--ok)}.reveal b.no{color:var(--no)}
.card{text-align:center;background:linear-gradient(160deg,#F3E2B8,#E5CF9F);border:2px solid var(--accent);border-radius:10px;padding:22px 18px;margin:8px 0 14px;box-shadow:0 4px 0 var(--shade)}
.card .em svg{width:84px;height:119px;display:block;margin:0 auto}
.card .rn{font-family:var(--serif);font-size:1.5rem;color:var(--accent);margin:4px 0 0}
.card .tg{font-size:.84rem;color:var(--sub)}
.card .ln{margin:10px 0 0;font-size:1rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;margin-top:16px;padding-top:14px;border-top:2px dashed var(--line);font-size:.9rem}
.kv dt{color:var(--sub)}.kv dd{margin:0}
.banner{background:#F3DFA6;border:2px solid #B8962E;color:#6B5110;border-radius:8px;padding:10px 12px;font-size:.84rem;margin:0 0 14px}
.note{font-size:.84rem;color:var(--sub);border-top:2px solid var(--line);margin-top:22px;padding-top:12px}
.grp{font-family:var(--serif);font-size:1.02rem;color:var(--accent);margin:20px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chip{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:3px 14px;font-size:.92rem}
.link{background:none;border:0;color:var(--accent);font:inherit;font-size:.92rem;text-decoration:underline;cursor:pointer;padding:10px 0}

/* ---- 進度小動畫：方塊小路，每走一步亮一塊，終點是星球和石像 ---- */
#scene{position:relative;height:126px;margin:0 2px 8px}
#scene .blocks{position:absolute;left:0;right:0;bottom:0;display:flex}
#scene .b{flex:1;height:var(--bh);position:relative;border:1px solid var(--ink);border-left-width:0;background:linear-gradient(#6F9A45 0 30%,#8A5A34 30% 100%)}
#scene .b:first-child{border-left-width:1px}
#scene .b::after{content:"";position:absolute;left:0;right:0;top:30%;bottom:0;background:radial-gradient(#6D4426 1px,transparent 1px) 0 0/6px 6px}
#scene .b.todo{filter:saturate(.3) brightness(1.1)}
#scene .b.done::before{content:"";position:absolute;left:4px;top:3px;width:6px;height:3px;background:#F2C94C;opacity:.9;z-index:1}
#scene .b.pop{animation:pop2 .45s steps(3)}
@keyframes pop2{0%{transform:translateY(0)}40%{transform:translateY(-6px)}100%{transform:translateY(0)}}
#scene .walker{position:absolute;bottom:var(--bh);width:32px;height:56px;left:0;transition:left .6s steps(8)}
#scene svg{width:100%;height:100%;shape-rendering:crispEdges;display:block}
#scene .walker svg{animation:bob .5s steps(1) infinite}
#scene .walker.idle svg{animation:none}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-2px)}}
#scene .legA{animation:legA .5s steps(1) infinite}
#scene .legB{animation:legB .5s steps(1) infinite}
#scene .walker.idle .legA{animation:none;opacity:1}
#scene .walker.idle .legB{animation:none;opacity:0}
@keyframes legA{0%{opacity:1}50%{opacity:0}}
@keyframes legB{0%{opacity:0}50%{opacity:1}}
#scene .planet{position:absolute;right:0;bottom:var(--bh);width:56px;height:52px}
#scene .planet svg{animation:sway 2s steps(2) infinite}
@keyframes sway{0%{transform:translateY(0)}50%{transform:translateY(-2px)}}
#scene .eye{display:none}
#scene .planet.five .eye{display:block;animation:glow .5s steps(1) infinite}
@keyframes glow{0%{opacity:1}50%{opacity:.35}}
#scene .walker.five{animation:jump .6s steps(3) 2}
@keyframes jump{0%{transform:translateY(0)}50%{transform:translateY(-16px)}100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){
  #scene .walker{transition:none}
  #scene .walker svg,#scene .planet svg,#scene .legA,#scene .legB,#scene .b.pop,#scene .walker.five,#scene .planet.five .eye{animation:none}
  #scene .legB{opacity:0}
}
</style>

function mk(c){var base=RT[c.k];if(c.a)base=rApply(base,c.a);var cr=RCR[c.c[0]],cc=RCC[c.c[1]],o='';
function put(x,y,f){o+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+f+'"/>'}
for(var y=0;y<cr.length;y++)for(var x=0;x<12;x++){var ch=cr[y][x];if(ch==='K')put(x,y,cc[0]);else if(ch==='k')put(x,y,cc[1]);else if(ch==='G')put(x,y,cc[2])}
for(var y2=0;y2<base.length;y2++)for(var x2=0;x2<12;x2++){var h=base[y2][x2];if(h==='.')continue;var f=c.p[h];if(f)put(x2,y2+cr.length,f)}
return '<svg viewBox="0 0 12 '+(cr.length+base.length)+'" shape-rendering="crispEdges" aria-hidden="true">'+o+'</svg>'}

const STEPS=['intro','who','g0','g1','g2','g3','city','dates','format','food','vibe','arrive','topic','result'];
const CARD_N=7;
const fresh=()=>({name:'',rel:-1,relOther:'',g:[-1,-1,-1,-1],city:-1,cityOther:'',dates:[],showAll:false,format:-1,invitees:[],inviteInput:'',food:[],foodNote:'',vibe:-1,arrive:-1,topic:[],hint:'',sending:false,sent:false});
let A=fresh(),step=0;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD=['日','一','二','三','四','五','六'];
function fmtDay(ds){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(ds||'');if(!m)return String(ds||'');
  const d=new Date(+m[1],+m[2]-1,+m[3]);
  return `${+m[2]}/${+m[3]}（${WD[d.getDay()]}）`;
}
function fmtWhen(w){
  let t=fmtDay(w.d);
  if(w.to&&w.to!==w.d)t+=`–${fmtDay(w.to)}`;
  if(w.note)t+=` ${w.note}`;
  return t;
}
const scored=()=>CONFIG.guess.filter(g=>g.answer!=null).length;
const isRight=(g,v)=>Array.isArray(g.answer)?g.answer.includes(v):v===g.answer;
const ansText=g=>(Array.isArray(g.answer)?g.answer:[g.answer]).map(k=>g.opts[k]).join('、');
const hits=()=>A.g.filter((v,i)=>CONFIG.guess[i].answer!=null&&isRight(CONFIG.guess[i],v)).length;
const openAns=()=>{const k=CONFIG.guess.findIndex(g=>g.answer==null);return k>=0&&A.g[k]>=0?CONFIG.guess[k].opts[A.g[k]]:''};
const cityName=()=>A.city>=0&&A.city<CONFIG.trips.length?CONFIG.trips[A.city].city:(A.city===CONFIG.trips.length?`其他：${A.cityOther.trim()||'（沒填）'}`:'（沒選）');
const isOther=()=>A.city===CONFIG.trips.length;
function dateLabels(){
  const out=[],byCity={},extra=[];
  A.dates.forEach(k=>{
    if(k==='none'){extra.push('這些時間都不行，我再告訴你');return}
    const m=/^c(\d+)d(\d+)$/.exec(k);if(!m)return;
    const ci=+m[1],t=CONFIG.trips[ci];if(!t)return;const w=t.when[+m[2]];if(!w)return;
    (byCity[ci]=byCity[ci]||[]).push([+m[2],fmtWhen(w)]);
  });
  CONFIG.trips.forEach((t,ci)=>{if(byCity[ci])out.push(`${t.city} ${byCity[ci].sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join('、')}`)});
  return out.concat(extra);
}

function role(){
  const s={};Object.keys(ROLES).forEach(k=>s[k]=0);
  const add=(k,n)=>{s[k]+=n};
  if(A.arrive===0){add('fox',2);add('geo',1);add('snake',1)}
  if(A.arrive===1){add('prince',1);add('rose',1);add('vain',1);add('pilot',1)}
  if(A.arrive===2){add('fox',1);add('king',2)}
  if(A.arrive===3){add('lamp',2);add('pilot',1)}
  if(A.vibe===0){add('fox',1);add('geo',1);add('snake',1)}
  if(A.vibe===1){add('rose',2);add('vain',1)}
  if(A.vibe===2){add('prince',1);add('drunk',1)}
  if(A.vibe===3){add('lamp',1);add('pilot',1)}
  A.topic.forEach(i=>{
    if(i===0)add('lamp',1);
    if(i===1){add('pilot',1);add('prince',1)}
    if(i===2)add('pilot',2);
    if(i===3)add('biz',2);
    if(i===4){add('geo',1);add('king',1)}
    if(i===5){add('snake',1);add('rose',1)}
    if(i===6){add('drunk',2);add('rose',1)}
    if(i===7){add('geo',1);add('snake',1)}
  });
  const order=['fox','prince','rose','lamp','geo','pilot','king','snake','vain','drunk','biz'];
  let best=order[0];order.forEach(k=>{if(s[k]>s[best])best=k});
  return ROLES[best];
}
function msg(){
  const r=role();
  const pick=(arr,idx)=>idx.map(i=>arr[i]).join('、');
  return [
    `【${CONFIG.title}】`,
    `我是：${A.name.trim()||'（沒留暱稱）'}（${A.rel===REL.length-1&&A.relOther.trim()?`其他：${A.relOther.trim()}`:REL[A.rel]}）`,
    `我在：${cityName()}`,
    `方便的時間：${dateLabels().join('；')||'（沒選）'}`,
    `見面方式：${FORMAT[A.format]}`,
    ...(groupOK()&&A.invitees.length?[`希望你也邀請：${A.invitees.join('、')}`]:[]),
    `飲食：${A.food.length?pick(FOOD,A.food):'沒有特別'}${A.foodNote.trim()?`（備註：${A.foodNote.trim()}）`:''}`,
    `喜歡的氣氛：${VIBE[A.vibe]}`,
    `想聊：${A.topic.length?pick(TOPIC,A.topic):'都可以'}`,
    `見面時的我：${ARR[A.arrive]}`,
    `我的赴約角色：${r.n}`,
    `猜猜我：猜中 ${hits()} / ${scored()}`,
    openAns()?`你覺得你是我的：${openAns()}`:null
  ].filter(Boolean).join('\n');
}

}

}
function canNext(id){
  if(id==='who')return A.name.trim().length>0&&A.rel>=0;
  if(id==='city')return A.city>=0;
  if(id==='dates')return A.dates.length>0;
  if(id==='format')return A.format>=0;
  if(id==='vibe')return A.vibe>=0;
  if(id==='arrive')return A.arrive>=0;
  if(id.startsWith('g'))return A.g[+id[1]]>=0;
  return true;
}

    <p class="small">慢慢來比較快</p>
    <h2>${esc(g.q)}</h2>${list}
    ${done?`<div class="reveal">${open?`<b class="ok">謝謝你告訴我，</b>${esc(g.note)}`:ok?'<b class="ok">天啊你也太了解我了吧！</b>':`<b class="no">啊啊啊沒事！</b>其實是「${esc(ansText(g))}」。`}${g.note&&!open?`<br>${esc(g.note)}`:''}</div>
    <button class="btn" data-a="next">${i<CONFIG.guess.length-1?'LET\'S GO':'快來拿邀請卡！'}</button>`:''}`;
  }
  if(id==='city')return `<p class="small">見面卡 1 / ${CARD_N}</p><h2>你想要在哪個城市見到我？</h2>
    ${opts(CONFIG.trips.map(t=>t.city).concat(['其他城市']),A.city,'city')}
    ${isOther()?`<label class="f" for="co">你在哪裡？（選填）</label><input id="co" type="text" maxlength="20" placeholder="例如：新加坡" value="${esc(A.cityOther)}" data-i="cityOther">
    <p class="small">我暫時沒排到那邊，下一步你可以看看其他城市的時間，或告訴我你什麼時候方便。</p>`:''}
    <button class="btn" data-a="next" ${canNext(id)?'':'disabled'}>下一步</button>`;
  if(id==='dates'){
    const home=(A.city>=0&&A.city<CONFIG.trips.length)?A.city:-1;
    const showAll=A.showAll||home<0;
    let html=`${banner()}<p class="small">見面卡 2 / ${CARD_N}</p><h2>${home>=0?`我在${esc(CONFIG.trips[home].city)}的這些時間，你哪天方便？`:'我的行程如下，你哪天方便？'}</h2><p class="sub">可以多選。我不會限制時段，有備註的是我已經知道的安排。</p>`;
    CONFIG.trips.forEach((t,ci)=>{
      if(!(showAll||ci===home))return;
      html+=`<div class="grp">${esc(t.city)}</div><div class="stack">${t.when.map((w,wi)=>dateBtn(`c${ci}d${wi}`,fmtWhen(w))).join('')}</div>`;
    });
    if(home>=0&&!A.showAll&&CONFIG.trips.length>1)html+=`<button type="button" class="link" data-a="showall">我也願意去其他城市，看其他時間</button>`;
    html+=`<div class="grp">其他</div><div class="stack">${dateBtn('none','這些時間都不行，我再告訴你')}</div>
    <button class="btn" data-a="next" ${canNext(id)?'':'disabled'}>下一步</button>`;
    return html;
  }
  if(id==='format')return `<p class="small">見面卡 3 / ${CARD_N}</p><h2>你比較想怎麼見面？</h2>${opts(FORMAT,A.format,'format')}${inviteBox()}
    <button class="btn" data-a="next" ${canNext(id)?'':'disabled'}>下一步</button>`;
  if(id==='food')return `<p class="small">見面卡 4 / ${CARD_N}</p><h2>吃的方面，我要注意什麼？</h2><p class="sub">可以多選，也可以略過。</p>${opts(FOOD,A.food,'food')}
    <label class="f" for="fn">忌口或過敏備註（選填）</label>
    <input id="fn" type="text" maxlength="40" placeholder="例如：不吃牛、花生過敏" value="${esc(A.foodNote)}" data-i="foodNote">
    <button class="btn" data-a="next">下一步</button>`;
  if(id==='vibe')return `<p class="small">見面卡 5 / ${CARD_N}</p><h2>你比較喜歡哪種氣氛？</h2>${opts(VIBE,A.vibe,'vibe')}
    <button class="btn" data-a="next" ${canNext(id)?'':'disabled'}>下一步</button>`;
  if(id==='arrive')return `<p class="small">見面卡 6 / ${CARD_N}</p><h2>久違見面，或第一次見面，你通常會？</h2>${opts(ARR,A.arrive,'arrive')}
    <button class="btn" data-a="next" ${canNext(id)?'':'disabled'}>下一步</button>`;
  if(id==='topic')return `<p class="small">見面卡 7 / ${CARD_N}</p><h2>你最想聊什麼？</h2><p class="sub">最多選 3 個，也可以略過。</p>${opts(TOPIC,A.topic,'topic')}
    <button class="btn" data-a="next">看我的見面卡</button>`;
  if(id==='result'){
    const r=role(),m=msg();
    const line=`https://line.me/R/msg/text/?${encodeURIComponent(m)}`;
    return `
    <h2>你的見面卡</h2>
    <div class="card">
      <div class="em">${r.svg}</div>
      <p class="small">你是我的故事裡的…</p><div class="rn">${esc(A.name.trim()||'未留暱稱')}　${r.n}</div>
      <div class="tg">${r.crown}・${r.tag}赴約者</div>
      <p class="ln">${esc(r.line)}</p>
      <dl class="kv">
        <dt>城市</dt><dd>${esc(cityName())}</dd>
        <dt>時間</dt><dd>${esc(dateLabels().join('；'))}</dd>
        <dt>方式</dt><dd>${esc(FORMAT[A.format])}</dd>
        <dt>氣氛</dt><dd>${esc(VIBE[A.vibe])}</dd>
        <dt>想聊</dt><dd>${A.topic.length?esc(A.topic.map(i=>TOPIC[i]).join('、')):'都可以'}</dd>
        <dt>猜猜我</dt><dd>猜中 ${hits()} / ${scored()}</dd>
      </dl>
    </div>
    <p class="small">小王子角色只是好玩的分類，不是正式測驗。</p>
    <h2 style="margin-top:22px">把見面卡傳給我</h2>
    <textarea id="out" rows="11" readonly>${esc(m)}</textarea>
    ${CONFIG.firebase?(A.sent?`<p class="small" role="status">✅ 已經送到我這裡了，謝謝你！我收到後會回你。</p>`:`<button type="button" class="btn" data-a="fbsend" ${A.sending?'disabled':''}>${A.sending?'送出中…':'直接傳給我'}</button>`):''}
    <div class="btnrow">
      ${CONFIG.igUser?`<a class="btn" data-a="igcopy" href="https://ig.me/m/${encodeURIComponent(CONFIG.igUser)}" target="_blank" rel="noopener">複製並開 IG 私訊</a>`:''}
      <a class="btn ${CONFIG.igUser?'ghost':''}" href="${line}" target="_blank" rel="noopener">用 LINE 傳</a>
      <button type="button" class="btn ghost" data-a="copy">複製訊息</button>
      <button type="button" class="btn ghost" data-a="share">分享…</button>
    </div>
    ${A.hint?`<p class="small" role="status">${esc(A.hint)}</p>`:''}
    <p class="note">IG 沒辦法自動帶入文字，所以流程是：${CONFIG.igUser?'按「複製並開 IG 私訊」，到聊天室貼上送出。':'按「複製訊息」，再貼到我們的 IG 聊天室。'}按下任何傳送按鈕之前，這張卡不會離開你的手機。</p>
    <button class="btn ghost" data-a="again">重新填一次</button>`;
  }
  return '';
}

/* ===== 進度小動畫（原創像素圖，不使用任何現成遊戲的素材） ===== */
function pxRect(x,y,w,h,f,cls){return '<rect'+(cls?' class="'+cls+'"':'')+' x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+f+'"/>'}
function pxSprite(rows,pal,ox,oy){let o='';for(let y=0;y<rows.length;y++)for(let x=0;x<rows[y].length;x++){const c=rows[y][x];if(c==='.'||!pal[c])continue;o+=pxRect(x+(ox||0),y+(oy||0),1,1,pal[c])}return o}
function walkerSvg(){
  const P={Y:'#F2C94C',y:'#C9A227',R:'#C9503A',H:'#E8B84A',h:'#C9962F',S:'#F0C9A0',E:'#3A2A1A',C:'#4F8A8B',c:'#3C6A6B',F:'#E8B84A',P:'#3B4A6B',B:'#3A2A1A'};
  const body=["..Y....YY....Y..","..YY..YYYY..YY..","..YYYYYRRYYYYY..","..yyyyyyyyyyyy..","...HHHHHHHHHH...","..HHHHHHHHHHHH..","..HHSSSSSSSSHH..","..HSSSSSSSSSSH..","..HSSESSSSESSH..","..hSSESSSSESSh..","..hSSSSSSSSSSh..","...hSSSSSSSSh...","....FFFFFFFF....","...FFFFFFFFFFFF.","..CCCFFFCCCC.FF.","..CCCCCCCCCCCC..","..CCcCCCCCCcCC..","..CCCCCCCCCCCC..","..SSCCCCCCCCSS..","...cCCCCCCCCc..."];
  const legs=["....PPPPPPPP....","....PPPPPPPP....","....PPP..PPP....","....PPP..PPP....","....PPP..PPP...."];
  const A=["....PPP..PP.....","...BBBB..BBB....","...BBBB........."];
  const B=A.map(r=>r.split('').reverse().join(''));
  return '<svg viewBox="0 0 16 28">'+pxSprite(body,P,0,0)+pxSprite(legs,P,0,20)+'<g class="legA">'+pxSprite(A,P,0,25)+'</g><g class="legB">'+pxSprite(B,P,0,25)+'</g></svg>';
}
function planetSvg(){
  const cx=13.5,cy=5.5,rx=13.6,ry=5.8,oy=14;
  const inE=(x,y,ex,ey,ax,ay)=>{const dx=(x-ex)/ax,dy=(y-ey)/ay;return dx*dx+dy*dy<=1};
  let o='';
  for(let y=0;y<12;y++)for(let x=0;x<28;x++){
    const u=(x-cx)/rx,v=(y-cy)/ry,d=Math.sqrt(u*u+v*v);if(d>1)continue;
    let c='#5A8FB0';
    if(u*0.8+v<-0.55)c='#7AB0CF';else if(u*0.5+v>0.45)c='#46758F';
    if(inE(x,y,7,4,3.2,1.5)||inE(x,y,19,7,3.6,1.7)||inE(x,y,12,8,2.2,1.1)||inE(x,y,23,3,2,1))c=v>0.4?'#5F8F4C':'#7FB069';
    if((x>=14&&x<=16&&y===2)||(x>=4&&x<=5&&y===7))c='#E8F1F5';
    if(d>0.88)c='#2F5A73';
    o+=pxRect(x,y+oy,1,1,c);
  }
  o+=pxRect(0,6,1,1,'#F2C94C')+pxRect(27,10,1,1,'#F2C94C');
  const M={G:'#A8A8A0',g:'#9A9A92',d:'#7A7A72',D:'#3A3A34',M:'#5A5A54'};
  const moai=["..gGGGGGGg..","..GGGGGGgd..","..GGGGGGgd..","..GDDGGDDgd.","..GDDGGDDgd.","..GGGGGGggd.","..GGGddGgd..","..GGGddGgd..","..GGGddGgd..","..GGGGGGgd..","..GGMMMMgd..","..GGGGGGgd..","...GGGGgd...","..GGGGGGGgd.","..GGGGGGGgd.","..GGGGGGGgd."];
  o+=pxSprite(moai,M,8,0)+pxRect(11,3,2,2,'#FFE27A','eye')+pxRect(15,3,2,2,'#FFE27A','eye')+pxRect(11,3,1,1,'#fff','eye')+pxRect(15,3,1,1,'#fff','eye');
  return '<svg viewBox="0 0 28 26">'+o+'</svg>';
}
let sceneReady=false,scenePrev=0,sceneTimer=0;
function initScene(){
  const el=document.getElementById('scene');if(!el)return;
  const B=STEPS.length-1;
  el.innerHTML='<div class="walker idle" id="walker">'+walkerSvg()+'</div><div class="planet" id="planet">'+planetSvg()+'</div><div class="blocks" id="blocks">'+'<div class="b todo"></div>'.repeat(B)+'</div>';
  sceneReady=true;
  window.addEventListener('resize',()=>{const w=document.getElementById('walker');if(!w)return;w.style.transition='none';updateScene(true);setTimeout(()=>{w.style.transition=''},50)});
}
function updateScene(silent){
  if(!sceneReady)return;
  const el=document.getElementById('scene'),w=document.getElementById('walker'),pl=document.getElementById('planet');
  const bs=document.getElementById('blocks').children,B=STEPS.length-1,tw=el.clientWidth;
  for(let i=0;i<B;i++){let c='b '+(i<step?'done':'todo');if(!silent&&i===step-1&&step>scenePrev)c+=' pop';bs[i].className=c}
  w.style.left=((tw-92)*Math.min(step,B)/B)+'px';
  w.classList.remove('idle','five');pl.classList.remove('five');
  clearTimeout(sceneTimer);
  sceneTimer=setTimeout(()=>{w.classList.add('idle');if(step>=B){w.classList.add('five');pl.classList.add('five')}},750);
  el.setAttribute('aria-valuenow',String(Math.round(step/B*100)));
  scenePrev=step;
}
function render(keepScroll){
  const y=window.scrollY,id=STEPS[step];
  const pct=Math.round(step/(STEPS.length-1)*100);
  const top=step>0?`<div class="top"><button type="button" class="back" data-a="prev" aria-label="上一步">← 上一步</button></div>`:'';
  document.getElementById('app').innerHTML=top+view(id);
  updateScene();
  window.scrollTo(0,keepScroll?y:0);
}
function toggle(arr,v,max){const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else if(!max||arr.length<max)arr.push(v)}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,v=+b.dataset.v;
  switch(a){
    case 'next':if(canNext(STEPS[step])){step=Math.min(STEPS.length-1,step+1);A.hint='';render(false)}break;
    case 'prev':step=Math.max(0,step-1);render(false);break;
    case 'rel':A.rel=v;render(true);break;
    case 'guess':{const i=+STEPS[step][1];if(A.g[i]<0){A.g[i]=v;render(true)}break}
    case 'city':if(A.city!==v){A.city=v;A.dates=[];A.showAll=false}render(true);break;
    case 'showall':A.showAll=true;render(true);break;
    case 'date':{const k=b.dataset.k;const i=A.dates.indexOf(k);if(i>=0)A.dates.splice(i,1);else A.dates.push(k);render(true);break}
    case 'format':A.format=v;render(true);break;
    case 'addinv':{const n=A.inviteInput.trim();if(n&&A.invitees.length<5&&!A.invitees.includes(n))A.invitees.push(n);A.inviteInput='';render(true);break}
    case 'delinv':A.invitees.splice(v,1);render(true);break;
    case 'food':toggle(A.food,v,0);render(true);break;
    case 'vibe':A.vibe=v;render(true);break;
    case 'arrive':A.arrive=v;render(true);break;
    case 'topic':toggle(A.topic,v,3);render(true);break;
    case 'igcopy':{try{navigator.clipboard.writeText(msg())}catch(_){}break}
    case 'again':A=fresh();step=0;render(false);break;
    case 'copy':{
      let ok=false;
      try{await navigator.clipboard.writeText(msg());ok=true}catch(_){}
      if(!ok){try{const t=document.getElementById('out');t.select();t.setSelectionRange(0,99999);ok=document.execCommand('copy')}catch(_){}}
      A.hint=ok?'已複製，貼到 IG 或任何聊天室傳給我就可以了。':'沒辦法自動複製，請長按上方文字框，選「全選」再複製。';
      render(true);break}
    case 'fbsend':{
      if(A.sending||A.sent)break;
      A.sending=true;A.hint='';render(true);
      try{
        const V='13.4.0',B='https://www.gstatic.com/firebasejs/'+V+'/';
        const [{initializeApp},{getAuth,signInAnonymously},{getFirestore,collection,addDoc,serverTimestamp}]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
        const app=initializeApp(CONFIG.firebase);
        await signInAnonymously(getAuth(app));
        const r=role();
        await addDoc(collection(getFirestore(app),'invites'),{
          createdAt:serverTimestamp(),
          name:A.name.trim(),
          relation:A.rel===REL.length-1&&A.relOther.trim()?'其他：'+A.relOther.trim():REL[A.rel],
          city:cityName(),
          dates:dateLabels(),
          format:FORMAT[A.format],
          invitees:groupOK()?A.invitees.slice(0,5):[],
          role:r.n,
          guessHits:hits(),
          guessTotal:scored(),
          message:msg()
        });
        A.sent=true;
      }catch(err){
        console.error(err);
        A.hint='直接傳送失敗了，請改用下面的 IG／LINE／複製。';
      }
      A.sending=false;render(true);break}
    case 'share':{
      let done=false;
      try{if(navigator.share){await navigator.share({text:msg()});done=true;A.hint=''}}catch(err){if(err&&err.name==='AbortError')done=true}
      if(!done)A.hint='這個瀏覽器開不了分享選單，請用「複製訊息」或「用 LINE 傳」。';
      render(true);break}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='iv'){e.preventDefault();const b=document.querySelector('[data-a=addinv]');if(b)b.click()}});
document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.i;
  if(k){A[k]=e.target.value;if(k==='name'){const b=document.querySelector('.btn[data-a=next]');if(b)b.disabled=!canNext(STEPS[step])}}
});
initScene();
render(false);
</script>
