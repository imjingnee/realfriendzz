<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>見面排程後台</title>
<style>
:root{--bg:#F6ECD2;--panel:#ECD9B4;--ink:#3A2A18;--sub:#6B5638;--line:#A8895A;--accent:#9A4B1F;--ok:#4C7A34;--no:#B0442A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:.2em 0}
h2{font-size:1.1rem;margin:1.2em 0 .4em}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tabs button,.btn{font:inherit;border:2px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 14px;cursor:pointer}
.tabs button.on,.btn.pri{background:var(--ink);color:#fff}
.btn.sm{padding:2px 10px;font-size:.88rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:#fff8;border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.card.done{border-color:var(--ok);background:#E7F0DA}
.small{font-size:.85rem;color:var(--sub)}
.chip{display:inline-block;border:2px solid var(--line);border-radius:999px;padding:0 10px;margin:2px 4px 2px 0;background:var(--panel);font-size:.9rem;font-family:inherit;color:var(--ink)}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--accent);background:#F3E2B8}
.tag{font-size:.8rem;border-radius:6px;padding:1px 8px;background:var(--line);color:#fff;margin-left:6px}
.tag.ok{background:var(--ok)}
.tag.no{background:var(--no)}
.day{border-left:6px solid var(--accent);padding-left:12px;margin:14px 0}
.day h3{margin:0 0 4px;font-size:1.05rem}
.slot{margin:6px 0}
#msg{position:sticky;top:0;background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;margin:8px 0;display:none}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:9}
.modal .box{background:var(--bg);border:2px solid var(--ink);border-radius:12px;padding:16px;max-width:520px;width:100%}
label{display:block;margin:10px 0 2px;font-weight:700;font-size:.92rem}
input,textarea,select{font:inherit;width:100%;border:2px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink)}
input[type=checkbox]{width:auto}
.row{display:flex;gap:10px}.row>*{flex:1}
pre{white-space:pre-wrap;margin:4px 0;font:inherit}
.cbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.cbar h2{margin:0 8px 0 0;font-size:1.2rem}
.cbar .sp{flex:1}
.seg button.on{background:var(--ink);color:#fff}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:2px solid var(--line);border-radius:10px;overflow:hidden;background:#fff8}
.mh{padding:4px;text-align:center;font-size:.8rem;color:var(--sub);background:var(--panel);border-bottom:2px solid var(--line)}
.mc{min-height:84px;border-right:1px solid #A8895A55;border-bottom:1px solid #A8895A55;padding:3px;cursor:pointer;overflow:hidden;font-size:.74rem}
.mc:nth-child(7n){border-right:0}
.mc:hover{background:#F3E2B8}
.mc.o{background:#0000000a;color:var(--sub)}
.mc.t .mn{background:var(--accent);color:#fff}
.mn{display:inline-block;min-width:22px;text-align:center;border-radius:999px;font-size:.82rem;font-weight:700}
.pill{display:block;border-radius:4px;padding:0 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.pill.ok{background:var(--ok);color:#fff}
.pill.av{background:#E9C98A;border:1px dashed var(--accent)}
.pill.pr{background:#fff;border:1px dashed var(--ok);color:var(--ok)}
.wkscroll{overflow-x:auto;border:2px solid var(--line);border-radius:10px;background:#fff8}
.wk{display:grid;grid-template-columns:42px repeat(7,minmax(104px,1fr));min-width:770px}
.wh{padding:4px 2px;text-align:center;font-size:.82rem;background:var(--panel);border-bottom:2px solid var(--line);border-left:1px solid #A8895A55}
.wh.t{background:var(--accent);color:#fff}
.wad{padding:2px;border-left:1px solid #A8895A55;border-bottom:1px solid #A8895A55;min-height:26px}
.tl{position:relative;font-size:.7rem;color:var(--sub)}
.tl span{position:absolute;right:4px;transform:translateY(-50%)}
.col{position:relative;border-left:1px solid #A8895A55;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 39px,#A8895A44 39px,#A8895A44 40px)}
.col.t{background-color:#F9E9C0}
.blk{position:absolute;border-radius:6px;padding:2px 4px;font-size:.76rem;line-height:1.3;overflow:auto;border:1px solid var(--ok);box-shadow:0 1px 2px #0003}
.blk.ok{background:var(--ok);color:#fff;cursor:pointer;border:0}
.blk.av{background:#F4DCA5;border:1.5px dashed var(--accent);color:var(--ink)}
.blk.pr{background:#fff;border:1.5px dashed var(--ok)}
.blk b{display:block;font-size:.72rem}
.blk .chip{font-size:.74rem;padding:0 7px;margin:1px 3px 1px 0}
.legend{font-size:.8rem;color:var(--sub);margin:6px 0}
.btn.del{border-color:var(--no);color:var(--no);background:#fff}

</style>
</head>
<body>
<div class="wrap">
  <h1>見面排程後台</h1>
  <p class="small" id="sum">載入中…</p>
  <div id="msg" role="status"></div>
  <div class="tabs" id="tabs">
    <button data-t="cal" class="on">排程日曆</button>
    <button data-t="rep">所有回覆</button>
    <button data-t="roster">誰還沒填</button>
    <button id="reload">重新整理</button>
  </div>
  <div id="view"></div>
</div>
<div class="modal" id="modal"><div class="box" id="box"></div></div>
<script>
(function(){
const SL=String.fromCharCode(47);
const IGU='https:'+SL+SL+'ig.me'+SL+'m'+SL;
const isHttp=u=>{const t=String(u||'').toLowerCase();return t.indexOf('http:'+SL+SL)===0||t.indexOf('https:'+SL+SL)===0};
const API='https://script.google.com/macros/s/AKfycbziZIBySs9FOaiKcR0Tqv4u-J9F1LzAQjUGi5O27WyNfTdQXwfBS7ca6VO-3xLrv4o7/exec';
let KEY='';try{KEY=localStorage.getItem('adminKey')||''}catch(e){}
let D={rows:[],roster:[],missing:[]},tab='cal',cur=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD=['日','一','二','三','四','五','六'];
function fmtDay(ds){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(ds||'');if(!m)return ds||'';const d=new Date(+m[1],+m[2]-1,+m[3]);return `${+m[2]}/${+m[3]}（${WD[d.getDay()]}）`}
function slotLabel(s){if(s.prop)return `提議：${fmtDay(s.d)}${s.note?' '+s.note:''}${s.place?'（'+s.place+'）':''}`;return `${s.city} ${fmtDay(s.d)}${s.to&&s.to!==s.d?'–'+fmtDay(s.to):''}${s.note?' '+s.note:''}`}
function toast(t){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',5000)}
async function call(fn,...a){
  const body={action:fn,key:KEY};
  if(fn==='confirmBooking'){body.id=a[0];body.o=a[1]}
  else if(fn==='cancelBooking'||fn==='deleteRow'){body.id=a[0]}
  else if(fn==='saveRoster'){body.names=a[0]}
  let res;
  try{res=await fetch(API,{method:'POST',body:JSON.stringify(body)})}catch(e){throw new Error('連不上伺服器，請檢查網路後再試')}
  let j;try{j=await res.json()}catch(e){throw new Error('伺服器回應格式不對，請確認後台已用「新版本」重新部署')}
  if(!j.ok)throw new Error(j.error||'失敗');
  return j.data;
}
function showLogin(msg){
  $('#sum').textContent='請輸入後台密碼';
  $('#tabs').style.display='none';
  $('#view').innerHTML=`<div class="card"><label for="pw">後台密碼</label><input id="pw" type="password" autocomplete="current-password" placeholder="就是你在 Code.gs 設定的那串">
  <p><button class="btn pri" id="pwb">進入後台</button></p><p class="small" id="pwe" style="color:var(--no)">${esc(msg||'')}</p>
  <p class="small">密碼只會存在這支手機／電腦的瀏覽器裡。</p></div>`;
  const go=()=>{KEY=$('#pw').value.trim();if(!KEY)return;try{localStorage.setItem('adminKey',KEY)}catch(e){}$('#tabs').style.display='';load()};
  $('#pwb').onclick=go;$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
}
function diag(t){const e=document.getElementById('sum');if(e)e.textContent=t}
window.addEventListener('error',ev=>diag('頁面錯誤：'+(ev.message||'未知')+'（第 '+(ev.lineno||'?')+' 行）請把這行文字抄給 Claude'));
window.addEventListener('unhandledrejection',ev=>diag('頁面錯誤：'+((ev.reason&&ev.reason.message)||ev.reason)+'（請把這行文字抄給 Claude）'));
async function load(){
  if(!KEY){showLogin('');return}
  diag('正在載入資料…');
  try{const r=await call('adminData');if(!r||!r.rows)throw new Error('伺服器回傳空白');D.rows=r.rows;D.roster=r.roster;D.missing=r.missing;render()}
  catch(e){
    if(/沒有權限/.test(e.message)){try{localStorage.removeItem('adminKey')}catch(_){}KEY='';showLogin('密碼不對，請再試一次');return}
    $('#sum').textContent='載入失敗：'+e.message+'（請把這行文字抄給 Claude）';
  }
}
function render(){
  const total=D.rows.length,conf=D.rows.filter(r=>r.status==='已確認').length;
  $('#sum').textContent=`已收到 ${total} 份回覆，已確認 ${conf} 位，待安排 ${total-conf} 位`+(D.roster.length?`，名單上還沒填：${D.missing.length} 位`:'');
  document.querySelectorAll('#tabs button[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#view').innerHTML=tab==='cal'?viewCal():tab==='rep'?viewRep():viewRoster();
}
function planHtml(r){
  const t=[r.acts,r.planText].filter(Boolean).map(esc).join('｜');
  const l=isHttp(r.planLink)?` <a href="${esc(r.planLink)}" target="_blank" rel="noopener">連結</a>`:'';
  return (t||l)?`<div>🍽 想一起做：${t}${l}</div>`:'';
}
function contact(r){
  const p=[];
  if(r.email)p.push(`✉ ${esc(r.email)}`);
  if(r.ig)p.push(`IG <a href="${IGU}${encodeURIComponent(r.ig.replace(/^@/,''))}" target="_blank" rel="noopener">${esc(r.ig)}</a>`);
  return p.length?p.join('　'):'<span class="small">沒留聯絡方式</span>';
}
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const pdate=ds=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(ds||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x};
const tmin=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(t||'');return m?+m[1]*60+ +m[2]:null};
let CV={mode:'month',a:ymd(new Date())};
const H0=7,HH=40;
function buildIndex(){
  const ix={};const g=d=>ix[d]||(ix[d]={conf:[],av:[],pr:[]});
  D.rows.forEach(r=>{
    if(r.status==='已確認'&&r.confDate){g(r.confDate).conf.push(r);return}
    r.slots.forEach(sl=>{
      if(sl.prop){if(pdate(sl.d))g(sl.d).pr.push({r:r,s:sl});return}
      const a=pdate(sl.d);if(!a)return;
      const z=pdate(sl.to)||a;
      for(let i=0,d=a;d<=z&&i<60;i++,d=addDays(a,i))g(ymd(d)).av.push({r:r,s:sl});
    });
  });
  return ix;
}
function lanes(items){
  items.sort((x,y)=>x.a-y.a||y.b-x.b);
  const ends=[];
  items.forEach(it=>{let l=0;while(ends[l]!==undefined&&ends[l]>it.a)l++;it.l=l;ends[l]=it.b});
  items.forEach(it=>{const ov=items.filter(o=>o.a<it.b&&o.b>it.a);it.n=Math.max.apply(null,ov.map(o=>o.l))+1});
  return items;
}
function viewCal(){
  const ix=buildIndex(),a=pdate(CV.a)||new Date(),today=ymd(new Date());
  const month=CV.mode==='month';
  let title,h='';
  if(month)title=`${a.getFullYear()} 年 ${a.getMonth()+1} 月`;
  else{const s0=addDays(a,-a.getDay()),e0=addDays(s0,6);title=`${s0.getMonth()+1}/${s0.getDate()} – ${e0.getMonth()+1}/${e0.getDate()}`}
  h+=`<div class="cbar"><h2>${esc(title)}</h2><button class="btn sm" data-act="nav" data-v="-1">‹</button><button class="btn sm" data-act="nav" data-v="0">今天</button><button class="btn sm" data-act="nav" data-v="1">›</button><span class="sp"></span>
  <span class="seg"><button class="btn sm ${month?'on':''}" data-act="mode" data-v="month">月</button> <button class="btn sm ${month?'':'on'}" data-act="mode" data-v="week">週</button></span></div>
  <div class="legend"><span class="chip" style="background:var(--ok);color:#fff;border-color:var(--ok)">已確認</span><span class="chip" style="background:#F4DCA5;border-style:dashed">朋友可以的時段（點名字安排）</span><span class="chip" style="border-style:dashed">對方提議</span></div>`;
  if(month){
    const f=new Date(a.getFullYear(),a.getMonth(),1),st=addDays(f,-f.getDay());
    h+='<div class="mgrid">'+WD.map(w=>`<div class="mh">${w}</div>`).join('');
    for(let i=0;i<42;i++){
      const d=addDays(st,i),k=ymd(d),x=ix[k]||{conf:[],av:[],pr:[]};
      if(i>=35&&d.getMonth()!==a.getMonth())break;
      const names=[...new Set(x.av.map(v=>v.r.id))].length;
      h+=`<div class="mc ${d.getMonth()!==a.getMonth()?'o':''} ${k===today?'t':''}" data-act="goweek" data-d="${k}"><span class="mn">${d.getDate()}</span>`+
        x.conf.slice(0,2).map(r=>`<span class="pill ok">${esc(r.confTime.split(/[–-]/)[0])} ${esc(r.name)}</span>`).join('')+(x.conf.length>2?`<span class="pill ok">+${x.conf.length-2}</span>`:'')+
        (names?`<span class="pill av">${names} 人可以</span>`:'')+(x.pr.length?`<span class="pill pr">${x.pr.length} 個提議</span>`:'')+`</div>`;
    }
    h+='</div><p class="small">點某一天，就會展開成那一週的時間表。</p>';
  }else{
    const s0=addDays(a,-a.getDay()),days=[...Array(7)].map((_,i)=>addDays(s0,i));
    h+='<div class="wkscroll"><div class="wk"><div class="wh" style="border-left:0"></div>'+days.map(d=>`<div class="wh ${ymd(d)===today?'t':''}">${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）</div>`).join('');
    // all-day row
    h+='<div class="wad" style="border-left:0;font-size:.7rem;color:var(--sub)">全天</div>'+days.map(d=>{
      const x=ix[ymd(d)]||{av:[],pr:[]};
      const al=x.av.filter(v=>!v.s.note);
      return `<div class="wad">${al.map(v=>`<button class="chip" data-act="book" data-id="${esc(v.r.id)}" data-d="${ymd(d)}" data-city="${esc(v.s.city)}" data-note="">${esc(v.r.name)}</button>`).join('')}</div>`}).join('');
    // time grid
    let tl='';for(let hr=H0;hr<=24;hr++)tl+=`<span style="top:${(hr-H0)*HH}px">${hr===24?'':hr+':00'}</span>`;
    h+=`<div class="tl" style="height:${(24-H0)*HH}px">${tl}</div>`;
    days.forEach(d=>{
      const k=ymd(d),x=ix[k]||{conf:[],av:[],pr:[]},items=[];
      x.conf.forEach(r=>{const p=r.confTime.split(/[–-]/);const a0=tmin(p[0]),b0=tmin(p[1]);if(a0!=null&&b0!=null)items.push({a:a0,b:b0,t:'ok',r:r})});
      const grp={};
      x.av.filter(v=>v.s.note).forEach(v=>{const t=NOTE_T(v.s.note);const key='av|'+t[0]+'|'+t[1]+'|'+v.s.city+'|'+v.s.note;(grp[key]=grp[key]||{a:tmin(t[0]),b:tmin(t[1]),t:'av',city:v.s.city,note:v.s.note,list:[]}).list.push(v.r)});
      Object.values(grp).forEach(g=>items.push(g));
      const pg={};
      x.pr.forEach(v=>{const t=NOTE_T(v.s.note||'');const key='pr|'+t[0]+'|'+t[1]+'|'+(v.s.place||'')+'|'+v.s.note;(pg[key]=pg[key]||{a:tmin(t[0]),b:tmin(t[1]),t:'pr',city:v.s.place||v.r.city,note:v.s.note,list:[]}).list.push(v.r)});
      Object.values(pg).forEach(g=>items.push(g));
      lanes(items);
      h+=`<div class="col ${k===today?'t':''}" style="height:${(24-H0)*HH}px">`+items.map(it=>{
        const top=Math.max(0,(it.a-H0*60)/60*HH),ht=Math.max(28,(it.b-it.a)/60*HH-2);
        const pos=`top:${top}px;height:${ht}px;left:calc(${it.l/it.n*100}% + 1px);width:calc(${100/it.n}% - 3px)`;
        if(it.t==='ok')return `<div class="blk ok" style="${pos}" data-act="book" data-id="${esc(it.r.id)}"><b>${esc(it.r.confTime)}</b>${esc(it.r.name)}${it.r.confCity?' · '+esc(it.r.confCity):''}</div>`;
        return `<div class="blk ${it.t}" style="${pos}"><b>${it.t==='pr'?'提議 ':''}${esc(it.note)} · ${esc(it.city)}</b>`+it.list.map(r=>`<button class="chip" data-act="book" data-id="${esc(r.id)}" data-d="${k}" data-city="${esc(it.city)}" data-note="${esc(it.note)}">${esc(r.name)}</button>`).join('')+`</div>`;
      }).join('')+`</div>`;
    });
    h+='</div></div><p class="small">點綠色方塊可以改時間；點黃色方塊裡的名字可以直接安排。左右可以滑動。</p>';
  }
  const none=D.rows.filter(r=>r.status!=='已確認'&&!r.slots.length);
  if(none.length)h+=`<h2>沒選到時段／時間都不行（${none.length}）</h2>`+none.map(r=>`<button class="chip" data-act="book" data-id="${esc(r.id)}">${esc(r.name)}</button>`).join('')+`<p class="small">這些人要你再跟他們約，點名字可手動指定日期。</p>`;
  return h;
}
function viewRep(){
  if(!D.rows.length)return '<p class="small">還沒有人填。</p>';
  return D.rows.slice().reverse().map(r=>`<div class="card ${r.status==='已確認'?'done':''}">
    <b>${esc(r.name)}</b><span class="tag ${r.status==='已確認'?'ok':''}">${esc(r.status)}</span> <span class="small">${esc(r.time)}・${esc(r.relation)}</span>
    <div>${esc(r.city)}　${esc(r.format)}${r.invitees?`　想邀請：${esc(r.invitees)}`:''}</div>
    ${planHtml(r)}
    <div class="small">最愛：${esc(r.hero||'—')}　角色：${esc(r.role)}　猜猜我：${esc(r.guess)}</div>
    <div><pre>${esc(r.dates)}</pre></div>
    <div>${contact(r)}</div>
    <button class="btn sm" data-act="book" data-id="${esc(r.id)}">${r.status==='已確認'?'改時間':'安排時間'}</button> <button class="btn sm del" data-act="del" data-id="${esc(r.id)}">刪除</button></div>`).join('');
}
function viewRoster(){
  const done=D.roster.filter(n=>!D.missing.includes(n));
  return `<h2>你的邀請名單</h2><p class="small">一行一個暱稱（要跟朋友填的暱稱一樣才對得起來）。存好後這裡會列出誰還沒填。</p>
  <textarea id="rost" rows="6" placeholder="小明&#10;小美">${esc(D.roster.join('\n'))}</textarea>
  <p><button class="btn pri" data-act="saveRoster">儲存名單</button></p>
  ${D.roster.length?`<h2>還沒填（${D.missing.length}）</h2>${D.missing.map(n=>`<span class="chip">${esc(n)}</span>`).join('')||'<p class="small">全部都填了 🎉</p>'}
  <h2>已填（${done.length}）</h2>${done.map(n=>`<span class="chip">${esc(n)} ✓</span>`).join('')}`:''}`;
}
function NOTE_T(n){n=n||'';return /早/.test(n)?['09:00','11:30']:/晚/.test(n)?['18:30','21:00']:/下午/.test(n)?['14:00','17:00']:['12:00','14:00']}
function openBook(id,pre){
  const r=D.rows.find(x=>x.id===id);if(!r)return;
  const first=r.slots.find(x=>!x.prop)||r.slots[0]||{};
  const d=(pre&&pre.d)||r.confDate||first.d||'';
  const city=(pre&&pre.city)||r.confCity||(first.prop?(first.place||r.city):first.city)||r.city;
  const [s0,e0]=r.confTime?r.confTime.split('–'):NOTE_T((pre&&pre.note)||first.note||'');
  cur={r:r};
  $('#box').innerHTML=`<h2 style="margin-top:0">安排：${esc(r.name)}</h2>
  <div class="small">${contact(r)}</div>
  ${planHtml(r)}
  ${r.slots.length?`<p class="small">他可以的時段：${r.slots.map(s=>esc(slotLabel(s))).join('、')}</p>`:'<p class="small">他沒有選時段，請自己指定日期。</p>'}
  <label>日期</label><input type="date" id="bd" value="${esc(d)}">
  <div class="row"><div><label>開始</label><input type="time" id="bs" value="${esc(s0)}"></div><div><label>結束</label><input type="time" id="be" value="${esc(e0)}"></div></div>
  <label>地點／城市</label><input id="bc" value="${esc(city)}">
  ${r.email?`<label><input type="checkbox" id="bm" checked> 同時寄確認信給 ${esc(r.email)}（信裡會附「加入 Google 行事曆」按鈕）</label>
  <label>信件主旨</label><input id="bsub" value="我們確定見面囉！">
  <label>信件內容</label><textarea id="bbody" rows="7"></textarea>`:
  `<p class="small">他沒留 Email。確認後下面會給你一段文字，可以複製後用 IG 傳給他。</p>`}
  <p><button class="btn pri" id="bok">確認並建立日曆</button> <button class="btn" id="bno">取消</button> <button class="btn sm del" id="bdel">刪除這筆回覆</button></p>
  <div id="berr" class="small" style="color:var(--no)"></div>`;
  const fill=()=>{const b=$('#bbody');if(b)b.value=mailBody(r)};
  fill();
  ['#bd','#bs','#be','#bc'].forEach(s=>$(s).addEventListener('change',()=>{const b=$('#bbody');if(b&&!b.dataset.edited)fill()}));
  if($('#bbody'))$('#bbody').addEventListener('input',e=>e.target.dataset.edited='1');
  $('#bno').onclick=closeBook;
  $('#bdel').onclick=()=>delRow(r.id,true);
  $('#bok').onclick=()=>submitBook(false);
  $('#modal').style.display='flex';
}
function mailBody(r){
  return `嗨 ${r.name}！\n\n我們約在 ${fmtDay($('#bd').value)} ${$('#bs').value}–${$('#be').value}，地點：${$('#bc').value}。\n細節我再跟你確認，到時候見！`;
}
async function delRow(id,fromModal){
  const r=D.rows.find(x=>x.id===id);if(!r)return;
  if(!confirm('確定要刪除「'+r.name+'」這筆回覆嗎？\n試算表上的這一列會被刪掉，如果已排行程，日曆上的活動也會一起刪除。刪掉就回不來了。'))return;
  try{const res=await call('deleteRow',id);D.rows=res.rows;D.roster=res.roster;D.missing=res.missing;if(fromModal)closeBook();render();toast('已刪除')}catch(err){toast('失敗：'+err.message)}
}
function closeBook(){$('#modal').style.display='none';cur=null}
async function submitBook(force){
  const r=cur.r;const o={date:$('#bd').value,start:$('#bs').value,end:$('#be').value,city:$('#bc').value,force:force,
    sendMail:!!($('#bm')&&$('#bm').checked),subject:$('#bsub')?$('#bsub').value:'',body:$('#bbody')?$('#bbody').value:''};
  if(!o.date||!o.start||!o.end){$('#berr').textContent='請填日期和時間';return}
  $('#bok').disabled=true;$('#berr').textContent='處理中…';
  try{
    const res=await call('confirmBooking',r.id,o);
    if(res.conflict){
      $('#berr').innerHTML=`你的日曆這段時間已經有：${esc(res.conflict.join('、'))}。 <button class="btn sm" id="force">還是要排</button>`;
      $('#bok').disabled=false;$('#force').onclick=()=>submitBook(true);return;
    }
    D.rows=res.rows;
    const ig=r.ig&&!r.email?`\n\nIG：${IGU}${encodeURIComponent(r.ig.replace(/^@/,''))}`:'';
    closeBook();render();
    if(res.mailed)toast(`已建立日曆，也寄信給 ${r.name} 了`);
    else if(!r.email){showText(r,o)}
    else toast('已建立日曆');
  }catch(e){$('#berr').textContent='失敗：'+e.message;$('#bok').disabled=false}
}
function showText(r,o){
  const t=`嗨 ${r.name}！我們約在 ${fmtDay(o.date)} ${o.start}–${o.end}，地點：${o.city}。到時候見！`;
  $('#box').innerHTML=`<h2 style="margin-top:0">已建立日曆 ✅</h2><p>${esc(r.name)} 沒有 Email，請你自己傳這段給他：</p>
  <textarea id="cp" rows="4" readonly>${esc(t)}</textarea>
  <p><button class="btn pri" id="cpb">複製</button> ${r.ig?`<a class="btn" href="${IGU}${encodeURIComponent(r.ig.replace(/^@/,''))}" target="_blank" rel="noopener">開 IG 私訊</a>`:''} <button class="btn" id="cls">關閉</button></p>`;
  $('#cpb').onclick=()=>{$('#cp').select();try{document.execCommand('copy');toast('已複製')}catch(e){}};
  $('#cls').onclick=closeBook;$('#modal').style.display='flex';
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;render();return}
  if(e.target.id==='reload'){load();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='del')delRow(b.dataset.id,false);
  if(a==='nav'){const v=+b.dataset.v,d=pdate(CV.a);CV.a=v===0?ymd(new Date()):ymd(CV.mode==='month'?new Date(d.getFullYear(),d.getMonth()+v,1):addDays(d,7*v));render()}
  if(a==='mode'){CV.mode=b.dataset.v;render()}
  if(a==='goweek'){CV.a=b.dataset.d;CV.mode='week';render()}
  if(a==='book')openBook(b.dataset.id,{d:b.dataset.d,city:b.dataset.city,note:b.dataset.note});
  if(a==='cancel'){
    if(!confirm('取消這個行程？日曆上的活動也會刪掉（不會寄信）。'))return;
    try{const r=await call('cancelBooking',b.dataset.id);D.rows=r.rows;render();toast('已取消')}catch(err){toast('失敗：'+err.message)}
  }
  if(a==='saveRoster'){
    try{const names=$('#rost').value.split('\n').map(s=>s.trim()).filter(Boolean);
      const r=await call('saveRoster',names);D.roster=r.roster;D.missing=r.missing;render();toast('名單已儲存')}catch(err){toast('失敗：'+err.message)}
  }
});
load();
})();
</script>
</body>
</html>
