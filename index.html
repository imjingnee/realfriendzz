<script>
/* ========= 資料定義 ========= */
const DIMS=[
 {k:'energy',n:'能量',e:'🔋',L:'獨處充電',R:'人群充電',lt:'I',rt:'E',q:'我充電的方式比較像…',gq:'「{n}」充電的方式比較像…',
  fric:'一個想多見面、一個需要獨處時，容易覺得被冷落，或覺得被打擾。',tip:'約好「見面日」和「獨處日」；需要獨處時先說一聲：「我在充電，不是不想理你。」'},
 {k:'info',n:'討論重點',e:'🧭',L:'重現實細節',R:'重想像可能',lt:'S',rt:'N',q:'討論事情時，我比較會…',gq:'討論事情時，「{n}」比較會…',
  fric:'一個抓事實和細節、一個談想像和可能，容易覺得對方「太挑剔」或「太飄」。',tip:'討論前先說這次是要「確認細節」還是「一起發想」。'},
 {k:'decide',n:'意見不同時',e:'⚖️',L:'先講道理',R:'先顧感受',lt:'T',rt:'F',q:'意見不同時，我比較會…',gq:'意見不同時，「{n}」比較會…',
  fric:'一個想先解決問題、一個想先被理解，容易覺得對方冷淡，或覺得對方情緒化。',tip:'先問一句：「你現在需要我聽你說，還是幫你想辦法？」'},
 {k:'pace',n:'步調',e:'🗓️',L:'先安排好',R:'隨性看情況',lt:'J',rt:'P',q:'面對計畫，我比較…',gq:'面對計畫，「{n}」比較…',
  fric:'一個習慣先計畫、一個習慣隨性，容易為了遲到、臨時改計畫起摩擦。',tip:'約定「至少提早幾小時通知」的底線，其餘就隨興。'},
 {k:'stress',n:'壓力反應',e:'🌊',L:'壓力下起伏明顯',R:'壓力下很穩定',lt:'',rt:'',q:'壓力大的時候，我通常…',gq:'壓力大的時候，「{n}」通常…',
  fric:'壓力下一個很穩定、一個起伏大，穩定的一方可能覺得對方「小題大作」，另一方覺得不被理解。',tip:'先約定一個暗號，代表「我需要被接住，不需要被分析」。'}
];
const LIKERT=DIMS.map((D,i)=>({d:i,t:D.q}));
const SCN=[
 {short:'訊息沒回',self:'對方很久沒回訊息時，我通常會…',guess:'「{n}」看到對方很久沒回訊息時，通常會…',opts:['覺得他在忙，不太在意','有點在意，但不會說','直接問怎麼了','我也晚點再回','開始胡思亂想']},
 {short:'遲到',self:'約好的時間，對方遲到了 20 分鐘，我會…',guess:'約好的時間，對方遲到了 20 分鐘，「{n}」會…',opts:['沒關係，自己找事做','有點不高興，但忍住','直接說我很在意','先問發生什麼事','之後會記在心裡']},
 {short:'臨時改計畫',self:'臨時要改計畫時，我的反應是…',guess:'臨時要改計畫時，「{n}」的反應是…',opts:['很好啊，隨興更有趣','可以，但需要時間調整','會有點煩躁','希望可以提早通知','看對方的理由']},
 {short:'想獨處時',self:'我想一個人待著時，被人找我會…',guess:'「{n}」想一個人待著時，被人找會…',opts:['沒差，照常回應','回應，但有點累','婉拒','希望事先說一聲','看是誰']},
 {short:'意見不同',self:'意見不一樣時，我通常會…',guess:'意見不一樣時，「{n}」通常會…',opts:['堅持講道理','先聽完再說','先退一步','轉移話題','事後再討論']},
 {short:'被誤會',self:'被誤會，或聽到不舒服的話時，我會…',guess:'被誤會，或聽到不舒服的話時，「{n}」會…',opts:['當場說清楚','先沉默冷靜','用玩笑帶過','之後私下談','默默記在心裡']}
];
const WORDS=['幽默','細心','有主見','愛思考','溫柔','直接','熱情','安靜','慢熱','隨性','可靠','完美主義','敏感','愛操心','獨立','固執','神祕','害羞','有創意','感性','理性','好說話','有行動力','很真實','好奇','務實','浪漫','謹慎','率真','樂觀','穩重','善良','冷靜','愛玩','有責任感','重感情','低調','愛笑','細膩','果斷'];
const EMOJIS=['🤴','🦊','🌹','👑','🎩','🍷','💼','🏮','🗺️'];
const EMO_LABEL={'🤴':'小王子','🦊':'狐狸','🌹':'玫瑰','👑':'國王','🎩':'虛榮的人','🍷':'酒鬼','💼':'商人','🏮':'點燈人','🗺️':'地理學家'};
const ARTIFACT_URL='https://claude.ai/artifact/Qq4HnZuroqKNttdAEQoviq';
const STATUS=['忙碌中','放空中','充電中','正在探索','剛好很開心','有點累'];
const INTERESTS=['閱讀','電影','音樂','旅行','美食','運動','創作','學術','遊戲','咖啡','散步','社會議題'];
const TOPICS=['人生選擇','工作職涯','創作靈感','社會議題','感情關係','好吃好玩','近期煩惱','夢想計畫'];
const REL=[
 {k:'how',q:'我們怎麼認識的？',o:['學校','工作','朋友介紹','網路認識','其他']},
 {k:'met',q:'我們見過面嗎？',o:['常常見面','偶爾見面','只見過一兩次','沒見過，只在線上聯絡']},
 {k:'close',q:'你覺得我們的交情到哪個程度？',o:['點頭之交','認識的人','普通朋友','好朋友','知心好友','靈魂之友'],
   desc:['見面會打招呼，但不太聊天','知道彼此是誰，偶爾聊幾句','有共同話題，會一起吃飯聊近況','會分享心情，有事會想到對方','很多心事都能說，也能講真話','不用多說就懂，是生命中很重要的人']},
 {k:'long',q:'我們認識多久了？',o:['不到 1 年','1–3 年','3–5 年','5–10 年','10 年以上']}
];
const PHASES=['自我介紹','心理測驗','猜猜看','我們的關係','揭曉'];
const TOPIC_Q={
 '人生選擇':['最近有沒有一個讓你猶豫的選擇？你怎麼想？','如果沒有任何限制，你會選哪條路？'],
 '工作職涯':['現在的工作或學業，哪一部分最讓你有成就感？','如果可以改變一件事，你想改什麼？'],
 '創作靈感':['最近有什麼東西讓你突然很有靈感？','你最想完成但還沒開始的作品是什麼？'],
 '社會議題':['最近有哪個議題讓你停下來想很久？','這個議題為什麼對你重要？'],
 '感情關係':['你覺得一段關係裡最重要的是什麼？','什麼樣的相處會讓你覺得被理解？'],
 '好吃好玩':['最近吃到最難忘的一餐是什麼？','下次想一起去哪裡走走？'],
 '近期煩惱':['最近有什麼小煩惱，想聽聽別人的看法？','你通常希望別人怎麼回應你的煩惱：聽就好，還是給建議？'],
 '夢想計畫':['三年後的你，希望正在做什麼？','現在離那件事最近的一小步是什麼？']
};
const TCATS=[['all','全部'],['mismatch','猜錯的地方'],['fric','可能的摩擦'],['topic','我們想聊的話題'],['generic','破冰小問題']];
const GENERIC_TALK=[
 {tag:'破冰',text:'各自說一件最近讓你開心的小事，對方猜猜看是什麼場景。'},
 {tag:'忙碌對齊',text:'你覺得對方最近有多忙？對方再說說自己真正的忙碌程度。'},
 {tag:'線上與現實',text:'你覺得社群上的你，和現實中的你，哪裡不太一樣？'}
];

/* ========= 狀態 ========= */
let EVENT='',JOINCODE='',HOMEMODE='';
const newP=()=>({
  profile:{name:'',emoji:'🤴',status:'',interests:[],topics:[],line:'',cr:false,cs:false},
  self:{lk:Array(LIKERT.length).fill(0),scn:Array(SCN.length).fill(-1),words:[]},
  guess:{dims:Array(5).fill(0),scn:Array(SCN.length).fill(-1),words:[]},
  rel:{how:-1,met:-1,close:-1,long:-1},
  reacts:{}
});
function normalize(p){const b=newP();p=p||{};return {profile:{...b.profile,...(p.profile||{})},self:{...b.self,...(p.self||{})},guess:{...b.guess,...(p.guess||{})},rel:{...b.rel,...(p.rel||{})},reacts:p.reacts||{}}}
let S=fresh();
function fresh(){return {rmode:'',mode:'home',step:0,steps:[],me:-1,code:'',created:0,players:[newP(),newP()],flags:[{},{}],myF:{profileDone:false,done:false},seen:{a:false,b:false},
  inv:'',revStep:0,rv:Array(SCN.length).fill(false),talk:0,tcat:'all',draft:{},fb:{len:'',fun:'',sent:false},admin:false,onlyConsent:false,err:'',joinErr:'',busy:false,saved:false,rec:null,unsubs:[]}}
const LOCAL=[];
let DB=null,CAN=false,WRITE=null,DBSTATE='checking',dlOK=false;
let lock=false,wq=Promise.resolve();
const queue=fn=>{wq=wq.then(fn).catch(()=>{});return wq};

function buildSteps(me){
  const s=[{t:'lobby',ph:1}];
  s.push({t:'profile',p:me,ph:1});
  LIKERT.forEach((_,i)=>s.push({t:'likert',p:me,i,ph:2}));
  SCN.forEach((_,i)=>s.push({t:'scn',p:me,i,ph:2}));
  s.push({t:'words',p:me,mode:'self',ph:2});
  s.push({t:'card',p:me,ph:2});
  s.push({t:'wait-prof',ph:3});
  s.push({t:'gdim',p:me,ph:3});
  SCN.forEach((_,i)=>s.push({t:'gscn',p:me,i,ph:3}));
  s.push({t:'words',p:me,mode:'guess',ph:3});
  s.push({t:'rel',p:me,ph:4});
  s.push({t:'wait-done',ph:4});
  return s;
}
const REV=[{t:'r-score'},...SCN.map((_,i)=>({t:'r-scn',i})),{t:'r-dim'},{t:'r-fric'},{t:'r-words'},{t:'r-rel'},{t:'r-talk'},{t:'r-end'}];

/* ========= 工具 ========= */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nm=p=>(S.players[p].profile.name||'').trim()||('玩家'+(p+1));
const emo=p=>S.players[p].profile.emoji;
const avg=a=>a.reduce((x,y)=>x+y,0)/(a.length||1);
function selfDim(p){return DIMS.map((_,d)=>avg(S.players[p].self.lk.filter((_,i)=>LIKERT[i].d===d)))}
function score(g){
  const t=1-g,G=S.players[g].guess,T=S.players[t];
  const m=SCN.map((_,i)=>G.scn[i]===T.self.scn[i]);
  const sd=selfDim(t);
  const dc=DIMS.map((_,d)=>1-Math.min(4,Math.abs(G.dims[d]-sd[d]))/4);
  const ov=G.words.filter(w=>T.self.words.includes(w)).length;
  const sc=Math.round(m.filter(Boolean).length/SCN.length*45+avg(dc)*45+Math.min(ov,2)/2*10);
  return {sc,m,dc,ov,hit:m.filter(Boolean).length};
}
function combined(){return Math.round((score(0).sc+score(1).sc)/2)}
function tier(n){return n>=85?'靈魂共鳴 ✨':n>=70?'默契十足 🎯':n>=50?'正在升溫 🔥':'好奇寶寶，開聊吧 🗨️'}
function topDim(p){const v=selfDim(p);let b=0;v.forEach((x,i)=>{if(x>v[b])b=i});return b}

function track(D,sv,ov){
  const pos=v=>((v-1)/4*100).toFixed(0);
  return `<div class="trk"><div class="trkbar">${ov?`<i class="mk oth" style="left:${pos(ov)}%"></i>`:''}${sv?`<i class="mk self" style="left:${pos(sv)}%"></i>`:''}</div><div class="scalecap"><span>◀ ${D.L}</span><span>${D.R} ▶</span></div></div>`;
}
function mbtiOf(vals){return DIMS.slice(0,4).map((D,i)=>{const v=vals[i];return v>=4?D.rt:(v>0&&v<=2)?D.lt:'X'}).join('')}
function pole(D,v){return v>=4?D.R:(v>0&&v<=2)?D.L:'在兩者之間'}
function stressTag(v){return v>=4?'壓力下偏穩定':(v>0&&v<=2)?'壓力下起伏較明顯':'壓力反應居中'}
function radar(series){
  const size=320,R=size*0.32,c=size/2;
  const pt=(i,v)=>{const a=(-90+i*72)*Math.PI/180,r=R*v/5;return [c+r*Math.cos(a),c+r*Math.sin(a)]};
  let g='';
  [1,2,3,4,5].forEach(l=>{g+=`<polygon class="rg" points="${DIMS.map((_,i)=>pt(i,l).map(x=>x.toFixed(1)).join(',')).join(' ')}"/>`});
  DIMS.forEach((d,i)=>{
    const [x,y]=pt(i,5);g+=`<line class="rg" x1="${c}" y1="${c}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
    const [lx,ly]=pt(i,6.4);
    g+=`<text class="rl" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle">${d.e} ${d.s}</text>`;
  });
  series.forEach(s=>{
    const pts=s.vals.map((v,i)=>pt(i,Math.max(v,0.3)).map(x=>x.toFixed(1)).join(',')).join(' ');
    g+=`<polygon points="${pts}" style="fill:${s.color};fill-opacity:${s.dash?0.06:0.22};stroke:${s.color};stroke-width:2.5;${s.dash?'stroke-dasharray:6 4;':''}"/>`;
  });
  return `<svg viewBox="0 0 ${size} ${size}" class="radar" role="img" aria-label="五個面向雷達圖">${g}</svg>`;
}

function render(keep){
  const y=window.scrollY;
  const app=document.getElementById('app');
  let html;
  if(S.admin)html=sAdmin();
  else if(S.mode==='home')html=sHome();
  else if(S.mode==='reveal')html=barHTML(5,Math.round(S.revStep/(REV.length-1)*100))+errBox()+screen(REV[S.revStep]);
  else{const st=S.steps[S.step];html=barHTML(st.ph,Math.round(S.step/(S.steps.length-1)*100))+errBox()+screen(st)}
  app.innerHTML=html;
  if(keep)window.scrollTo(0,y);else window.scrollTo(0,0);
}

function barHTML(ph,pct){

function screen(st){
  switch(st.t){
    case 'lobby':return sLobby();

    case 'likert':return sLikert(st);
    case 'scn':return sScn(st,false);
    case 'gscn':return sScn(st,true);
    case 'words':return sWords(st);
    case 'card':return sCard(st.p);

    case 'r-fric':return sRFric();
    case 'r-words':return sRWords();
    case 'r-rel':return sRRel();
    case 'r-talk':return sRTalk();
    case 'r-end':return sREnd();
  }
  return '';
}

function sRScn(i){
  const q=SCN[i];
  const rows=[0,1].map(g=>{
    const t=1-g,gi=S.players[g].guess.scn[i],ri=S.players[t].self.scn[i],ok=gi===ri;
    return `<div class="duel"><div class="who">${emo(g)} ${esc(nm(g))} 猜 ${esc(nm(t))} 會選</div><div class="ans">${esc(q.opts[gi])}</div>

  }).join('');
  return `<p class="small">揭曉 ${i+1} / ${SCN.length}</p><span class="tag">${esc(q.short)}</span>

function talkCards(){
  const c=[];
  for(const g of [0,1]){
    const t=1-g,sc=score(g),G=S.players[g].guess,T=S.players[t];
    SCN.forEach((q,i)=>{if(!sc.m[i])c.push({type:'mismatch',tag:q.short,text:`${nm(g)}猜${nm(t)}會選「${q.opts[G.scn[i]]}」，但${nm(t)}其實是「${q.opts[T.self.scn[i]]}」。${nm(t)}說說你的版本，${nm(g)}為什麼會這樣猜？`})});
    const sd=selfDim(t);let best=0;DIMS.forEach((_,k)=>{if(Math.abs(G.dims[k]-sd[k])>Math.abs(G.dims[best]-sd[best]))best=k});
    if(Math.abs(G.dims[best]-sd[best])>=1)c.push({type:'mismatch',tag:DIMS[best].n,text:`${nm(g)}覺得${nm(t)}在「${DIMS[best].n}」偏向「${pole(DIMS[best],G.dims[best])}」，但${nm(t)}自己是「${pole(DIMS[best],sd[best])}」。差在哪裡？`});
    const blind=G.words.filter(w=>!T.self.words.includes(w));
    if(blind.length)c.push({type:'mismatch',tag:'盲點詞',text:`${nm(g)}覺得${nm(t)}很「${blind[0]}」，但${nm(t)}沒選這個詞。${nm(t)}自己怎麼看？`});
  }
  const ca=S.players[0].rel.close,cb=S.players[1].rel.close;
  if(ca!==cb)c.push({type:'mismatch',tag:'交情',text:`${nm(0)}覺得你們是「${REL[2].o[ca]}」，${nm(1)}覺得是「${REL[2].o[cb]}」。各自說說，是哪些事讓你這樣覺得？`});
  const fa=selfDim(0),fb=selfDim(1),fric=[];
  DIMS.forEach((D,k)=>{if(Math.abs(fa[k]-fb[k])>=2)fric.push({type:'fric',tag:'可能的摩擦 · '+D.n,text:`${nm(0)}偏「${pole(D,fa[k])}」，${nm(1)}偏「${pole(D,fb[k])}」。最近有沒有因此卡住過？下次可以先約定什麼？（小提示：${D.tip}）`})});
  const topic=[];
  [0,1].forEach(g=>S.players[g].profile.topics.forEach(tp=>(TOPIC_Q[tp]||[]).forEach(q=>topic.push({type:'topic',tag:'想聊 · '+tp,text:`${nm(g)}想聊「${tp}」。${q}`}))));
  return c.slice(0,9).concat(fric,topic,GENERIC_TALK.map(x=>({...x,type:'generic'})));
}

  const all=talkCards();

function csvOf(recs){
  const h=['時間','場次','玩家','暱稱','狀態','興趣','想聊話題','一句話','同意研究','同意展出',
    ...DIMS.map(d=>'自評_'+d.n),'自選形容詞',...SCN.map(q=>'自答_'+q.short),
    ...DIMS.map(d=>'猜對方_'+d.n),...SCN.map(q=>'猜對方_'+q.short),'猜對方形容詞',
    ...REL.map(r=>'關係_'+r.q),'玩法','情境猜中數','該玩家默契分','雙人默契','回饋_長度','回饋_最有趣','反應與評論','題庫版本','MBTI風格_自評'];
  const rows=[];
  recs.forEach(r=>[0,1].forEach(g=>{
    const p=r.players[g],f=fbOf(r,g);
    rows.push([new Date(r.ts).toISOString(),r.event,g+1,p.name,p.status,p.interests.join('、'),p.topics.join('、'),p.line,p.cr?'是':'否',p.cs?'是':'否',
      ...p.dims.map(v=>v.toFixed(1)),p.words.join('、'),...p.scn.map((v,i)=>SCN[i].opts[v]),
      ...p.guessDims,...p.guessScn.map((v,i)=>SCN[i].opts[v]),p.guessWords.join('、'),
      ...REL.map(x=>x.o[p.rel[x.k]]),r.mode==='online'?'線上':'線下',r.scores.hit[g],g?r.scores.b:r.scores.a,r.scores.combined,f.len||'',f.fun||'',reactText((RX[r.sid+'-'+g]||{}).reacts),r.bank||'v1',mbtiOf(p.dims)]);
  }));
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  return '\ufeff'+[h,...rows].map(r=>r.map(q).join(',')).join('\r\n');
}

const seatId=i=>i?'b':'a';
function buildRec(){
  const a=score(0),b=score(1);
  return {sid:S.code+'-'+S.created,ts:S.created||Date.now(),event:EVENT,mode:S.rmode,bank:'v2',
    players:S.players.map((P,i)=>({name:nm(i),emoji:P.profile.emoji,status:P.profile.status,interests:P.profile.interests,topics:P.profile.topics,line:P.profile.line,
      cr:P.profile.cr,cs:P.profile.cs,dims:selfDim(i),words:P.self.words,scn:P.self.scn,
      guessDims:P.guess.dims,guessScn:P.guess.scn,guessWords:P.guess.words,rel:P.rel})),
    scores:{a:a.sc,b:b.sc,combined:combined(),hit:[a.hit,b.hit]}};
}
function pushSeat(){
  if(!DB||S.me<0)return;
  const code=S.code,me=S.me,data={p:S.players[me],f:{...S.myF},ts:Date.now()};
  return queue(async()=>{try{await DB.doc(`rooms/${code}/seats/${seatId(me)}`).set(data)}catch(e){S.err='資料寫入失敗，可能沒有貢獻者權限。';render(true)}});
}
function pushSync(){
  if(!DB||!S.code||S.rmode!=='offline')return;
  const code=S.code,data={step:S.revStep,rv:[...S.rv],talk:S.talk,tcat:S.tcat,ts:Date.now()};
  return queue(async()=>{try{await DB.doc(`rooms/${code}/sync/s`).set(data)}catch(e){S.err='同步失敗，請確認網路。';render(true)}});
}
function subscribe(){
  const code=S.code;
  S.unsubs.push(DB.collection(`rooms/${code}/seats`).onSnapshot(snap=>{
    if(S.code!==code)return;
    snap.docs.forEach(d=>{
      if(d.id==='a')S.seen.a=true;if(d.id==='b')S.seen.b=true;
      const idx=d.id==='a'?0:1;if(idx===S.me)return;
      const x=d.data();if(x&&x.p){S.players[idx]=normalize(x.p);S.flags[idx]=x.f||{};if(S.rec)RX[S.rec.sid+'-'+idx]={sid:S.rec.sid,seat:idx,reacts:S.players[idx].reacts}}
    });
    if(S.mode==='reveal'&&!typing())render(true);
    if(S.mode==='room'&&['lobby','wait-prof','wait-done'].includes(S.steps[S.step].t))checkAuto();
  },()=>{S.err='同步連線中斷，請重新整理頁面。';render(true)}));
  if(S.rmode==='offline')S.unsubs.push(DB.doc(`rooms/${code}/sync/s`).onSnapshot(snap=>{
    if(S.code!==code||!snap.exists)return;
    const x=snap.data()||{};
    const stepChanged=(x.step||0)!==S.revStep;
    S.revStep=x.step||0;S.rv=Array.isArray(x.rv)?x.rv.slice(0,SCN.length).concat(Array(SCN.length).fill(false)).slice(0,SCN.length):S.rv;S.talk=x.talk||0;S.tcat=x.tcat||'all';
    if(S.mode==='reveal')render(!stepChanged);
  },()=>{}));
}
function checkAuto(){
  if(S.mode!=='room')return;
  const st=S.steps[S.step],o=1-S.me;
  if(st.t==='lobby'){if(S.rmode==='offline'&&S.seen.a&&S.seen.b){go(1);return}render(true);return}
  if(st.t==='wait-prof'&&S.flags[o].profileDone){go(1);return}
  if(st.t==='wait-done'&&S.flags[o].done&&S.myF.done){enterReveal();return}
  render(true);
}
function enterReveal(){
  S.mode='reveal';S.revStep=0;
  S.rec=buildRec();LOCAL.push(S.rec);
  if(!S.saved){
    S.saved=true;const rec=S.rec;
    queue(async()=>{try{await DB.doc('sessions/'+rec.sid).set(rec)}catch(e){}});
  }
  render(false);
}
async function createRoom(){
  S.busy=true;S.joinErr='';render(true);
  try{
    let code='';
    for(let k=0;k<6&&!code;k++){const c=String(Math.floor(10000+Math.random()*90000));const r=await DB.doc('rooms/'+c).get();if(!r.exists)code=c}
    if(!code)throw new Error('no code');
    const created=Date.now();
    await DB.doc('rooms/'+code).set({created,event:EVENT,mode:HOMEMODE||'offline'});
    const ev=EVENT;S=fresh();EVENT=ev;
    S.rmode=HOMEMODE||'offline';S.code=code;S.created=created;S.me=0;S.mode='room';S.steps=buildSteps(0);S.seen.a=true;
    await DB.doc(`rooms/${code}/seats/a`).set({p:S.players[0],f:{},ts:Date.now()});
    subscribe();render(false);
  }catch(e){S.busy=false;S.joinErr='建立房間失敗（錯誤代碼：'+(e&&e.code||e&&e.message||'未知')+'）。常見原因是這個帳號對頁面沒有寫入權限。';render(true)}
}
async function joinRoom(){
  const code=JOINCODE.replace(/\D/g,'');
  if(code.length!==5){S.joinErr='請輸入 5 位數房間碼。';render(true);return}
  S.busy=true;S.joinErr='';render(true);
  try{
    const r=await DB.doc('rooms/'+code).get();
    if(!r.exists){S.busy=false;S.joinErr='找不到這個房間，請再確認房間碼。';render(true);return}
    const b=await DB.doc(`rooms/${code}/seats/b`).get();
    if(b.exists){S.busy=false;S.joinErr='這個房間已經有兩個人了。';render(true);return}
    const info=r.data()||{};
    S=fresh();
    EVENT=info.event||'';S.rmode=info.mode||'offline';S.code=code;S.created=info.created||Date.now();S.me=1;S.mode='room';S.steps=buildSteps(1);S.seen.b=true;
    await DB.doc(`rooms/${code}/seats/b`).set({p:S.players[1],f:{},ts:Date.now()});
    subscribe();render(false);
  }catch(e){S.busy=false;S.joinErr='加入失敗（錯誤代碼：'+(e&&e.code||e&&e.message||'未知')+'）。常見原因是這個帳號對頁面沒有寫入權限。';render(true)}
}
async function resumeRoom(seat){
  const code=JOINCODE.replace(/\D/g,'');
  if(code.length!==5){S.joinErr='請輸入 5 位數房間碼。';render(true);return}
  S.busy=true;S.joinErr='';render(true);
  try{
    const r=await DB.doc('rooms/'+code).get();
    if(!r.exists){S.busy=false;S.joinErr='找不到這個房間，請再確認房間碼。';render(true);return}
    const sd=await DB.doc(`rooms/${code}/seats/${seatId(seat)}`).get();
    if(!sd.exists){S.busy=false;S.joinErr='這個房間裡還沒有第 '+(seat+1)+' 位。';render(true);return}
    const info=r.data()||{},x=sd.data()||{};
    S=fresh();
    EVENT=info.event||'';S.rmode=info.mode||'offline';S.code=code;S.created=info.created||Date.now();S.me=seat;S.mode='room';S.steps=buildSteps(seat);
    S.players[seat]=normalize(x.p);S.myF={profileDone:false,done:false,...(x.f||{})};
    const idx=t=>S.steps.findIndex(z=>z.t===t);
    S.step=!S.myF.profileDone?idx('profile'):!S.myF.selfDone?idx('likert'):!S.myF.done?idx('wait-prof'):idx('wait-done');
    subscribe();render(false);
    if(['wait-prof','wait-done'].includes(S.steps[S.step].t))checkAuto();
  }catch(e){S.busy=false;S.joinErr='回到房間失敗（錯誤代碼：'+(e&&e.code||e&&e.message||'未知')+'）。';render(true)}
}
function leaveRoom(){S.unsubs.forEach(u=>{try{u()}catch(_){}});const ev=EVENT;S=fresh();EVENT=ev;JOINCODE='';render(false)}

/* ===== 事件 ===== */
function go(n){
  const cur=S.steps[S.step];
  if(n>0&&cur){
    if(cur.t==='profile'){S.myF.profileDone=true;pushSeat()}
    if(cur.t==='card'){S.myF.selfDone=true;pushSeat()}
    if(cur.t==='rel'){S.myF.done=true;pushSeat()}
  }
  S.step=Math.max(0,Math.min(S.steps.length-1,S.step+n));
  render(false);
  if(['lobby','wait-prof','wait-done'].includes(S.steps[S.step].t))checkAuto();
}
function advance(){if(lock)return;lock=true;setTimeout(()=>{lock=false;go(1)},220)}
function toggle(arr,v,max){const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else if(arr.length<max)arr.push(v)}
async function loadRemote(){
  if(!DB||!CAN)return;
  try{const snap=await DB.collection('sessions').get();REMOTE=snap.docs.map(d=>d.data()).filter(x=>x&&x.sid)}catch(e){}
  try{const rx=await DB.collection('reactions').get();rx.docs.forEach(d=>{const x=d.data();if(x&&x.sid)RX[x.sid+'-'+x.seat]=x})}catch(e){}
  try{const f=await DB.collection('feedback').get();FB={};f.docs.forEach(d=>{const x=d.data();if(x&&x.sid)FB[x.sid+'-'+x.seat]=x})}catch(e){}
}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const d=b.dataset,p=+d.p,i=+d.i,v=d.v;
  switch(d.a){
    case 'create':createRoom();break;
    case 'join':joinRoom();break;
    case 'resume':resumeRoom(+d.v);break;
    case 'hm':HOMEMODE=d.v;S.joinErr='';render(false);break;
    case 'next':
      if(S.mode==='reveal'){S.revStep=Math.min(REV.length-1,S.revStep+1);pushSync();render(false)}
      else go(1);
      break;
    case 'emoji':S.players[p].profile.emoji=v;render(true);break;
    case 'status':S.players[p].profile.status=S.players[p].profile.status===v?'':v;render(true);break;
    case 'tog':toggle(S.players[p].profile[d.f],v,+d.max);render(true);break;
    case 'lk':S.players[p].self.lk[i]=+v;render(true);advance();break;
    case 'scn':S.players[p].self.scn[i]=+v;render(true);advance();break;
    case 'gscn':S.players[p].guess.scn[i]=+v;render(true);advance();break;
    case 'gdim':S.players[p].guess.dims[+d.k]=+v;render(true);break;
    case 'word':toggle(S.players[p][d.m==='guess'?'guess':'self'].words,v,5);render(true);break;
    case 'rel':S.players[p].rel[d.k]=+v;render(true);break;
    case 'reveal':S.rv[i]=true;pushSync();render(true);break;
    case 'share':
      try{if(navigator.share){await navigator.share({title:'我們怎麼看彼此',text:inviteText()});S.inv=''}else{S.inv='這個瀏覽器不支援分享選單，請用「複製邀請訊息」。'}}catch(err){if(err&&err.name!=='AbortError')S.inv='分享選單開不起來，請用「複製邀請訊息」。'}
      render(true);break;
    case 'copyinv':{
      let ok=false;
      try{await navigator.clipboard.writeText(inviteText());ok=true}catch(_){}
      if(!ok){try{const ta=document.getElementById('invtext');ta.removeAttribute('readonly');ta.select();ok=document.execCommand('copy');ta.setAttribute('readonly','')}catch(_){}}
      S.inv=ok?'已複製，貼到 IG、LINE 或任何地方傳給對方。':'無法自動複製，請長按上方文字框手動複製。';render(true);break}
    case 'tcat':S.tcat=v;S.talk=0;pushSync();render(true);break;
    case 'talk':S.talk++;pushSync();render(true);break;
    case 'react':{const R=S.players[S.me].reacts=S.players[S.me].reacts||{};const m=R[d.k]||{};R[d.k]={...m,e:m.e===v?'':v};pushReacts();render(true);break}
    case 'rsend':{const R=S.players[S.me].reacts=S.players[S.me].reacts||{};const m=R[d.k]||{};R[d.k]={...m,t:(S.draft[d.k]||'').trim()};pushReacts();render(true);break}
    case 'restart':leaveRoom();break;
    case 'admin':S.admin=true;render(false);await loadRemote();render(true);break;
    case 'back':S.admin=false;render(false);break;
    case 'fb':if(!S.fb.sent){S.fb[d.k]=v;render(true)}break;
    case 'fbsend':
      if(S.rec&&DB){const rec=S.rec,me=S.me,fb={sid:rec.sid,seat:me,len:S.fb.len,fun:S.fb.fun};queue(async()=>{try{await DB.doc('feedback/'+rec.sid+'-'+me).set(fb)}catch(_){}})}
      S.fb.sent=true;render(true);break;
    case 'csv':
      try{const dl=await claude.use('downloads');if(dl)await dl.save({filename:'we-see-each-other.csv',data:csvOf(allRecs().filter(r=>(!S.onlyConsent||r.players.every(p=>p.cs))&&(!DB||CAN||LOCAL.some(l=>l.sid===r.sid))))})}catch(_){}
      break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target,f=t.dataset.f;if(!f)return;
  if(f==='event'){EVENT=t.value;return}
  if(f==='joincode'){JOINCODE=t.value;return}
  if(f==='rtext'){const k=t.dataset.k;S.draft[k]=t.value;const mine=((S.players[S.me].reacts||{})[k]||{}).t||'';const bt=document.querySelector('[data-a="rsend"][data-k="'+k+'"]');if(bt){bt.disabled=!t.value.trim()||t.value.trim()===mine;bt.textContent='送出評論'}return}
  const p=+t.dataset.p;
  if(f==='name'){S.players[p].profile.name=t.value;const btn=document.getElementById('pf-next');if(btn)btn.disabled=!t.value.trim()}
  if(f==='line')S.players[p].profile.line=t.value;
});
document.addEventListener('change',e=>{
  const t=e.target,f=t.dataset.f;if(!f)return;
  if(f==='cr'||f==='cs')S.players[+t.dataset.p].profile[f]=t.checked;
  if(f==='onlyConsent'){S.onlyConsent=t.checked;render(true)}
});

/* ===== 啟動與能力偵測 ===== */
render(false);
(async()=>{
  try{
    if(typeof claude==='undefined'){DBSTATE='none';return}
    DB=await claude.use('db');
    const u=await claude.use('user');
    CAN=u?await u.canEdit():false;
    WRITE=u?await u.can('data.write'):null;
    const dl=await claude.use('downloads');dlOK=!!dl;
    DBSTATE=DB?'ok':'none';
  }catch(e){DBSTATE='none'}
  if(S.mode==='home'&&!S.admin)render(true);
})();
</script>
